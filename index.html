<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Liquid Cat — Riffle Demo</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #F4F0FF;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: grab;
    }
    canvas:active { cursor: grabbing; }
    #hint {
      position: fixed;
      left: 50%;
      top: 12%;
      transform: translateX(-50%);
      color: rgba(80, 60, 100, 0.55);
      font-size: 14px;
      letter-spacing: 0.02em;
      pointer-events: none;
      opacity: 1;
      transition: opacity 0.8s ease;
      white-space: nowrap;
      z-index: 2;
    }
    #hint.fade { opacity: 0; }
  </style>
</head>
<body>
  <div id="hint">Squish the cat!</div>
  <canvas id="c"></canvas>
  <script>
(function () {
  'use strict';

  // ===== Step 2: Bézier hull + ears + look-at face on Verlet soft body =====
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const hint = document.getElementById('hint');

  const COLORS = {
    bg: '#F4F0FF',
    cat: '#FF9E9E',
    catDeep: '#FF8585',
    face: '#FF5277',
    highlight: 'rgba(255,255,255,0.4)',
  };

  let W = 0, H = 0, dpr = 1;
  let lastTime = 0;
  let hintFading = false;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function vdist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

  const OUTER_N = 16;
  const CONSTRAINT_ITERS = 4;
  const DAMPING = 0.985;
  const GRAVITY = 0.18;
  const RADIUS = () => Math.min(W, H) * 0.16;

  /** @type {{x:number,y:number,ox:number,oy:number,pinned:boolean}[]} */
  let points = [];
  /** @type {{a:number,b:number,rest:number,stiffness:number}[]} */
  let springs = [];

  function makePoint(x, y) {
    return { x, y, ox: x, oy: y, pinned: false };
  }

  function buildCat(cx, cy, r) {
    points = [];
    springs = [];
    points.push(makePoint(cx, cy));
    for (let i = 0; i < OUTER_N; i++) {
      const a = (i / OUTER_N) * Math.PI * 2 - Math.PI / 2;
      points.push(makePoint(cx + Math.cos(a) * r, cy + Math.sin(a) * r));
    }
    for (let i = 0; i < OUTER_N; i++) {
      const a = 1 + i;
      const b = 1 + ((i + 1) % OUTER_N);
      springs.push({ a, b, rest: vdist(points[a], points[b]), stiffness: 0.55 });
      springs.push({ a: 0, b: a, rest: r, stiffness: 0.35 });
      const c = 1 + ((i + 2) % OUTER_N);
      springs.push({ a, b: c, rest: vdist(points[a], points[c]), stiffness: 0.22 });
    }
  }

  function verletIntegrate(dtScale) {
    const g = GRAVITY * dtScale * dtScale;
    for (let i = 0; i < points.length; i++) {
      const p = points[i];
      if (p.pinned) continue;
      const vx = (p.x - p.ox) * DAMPING;
      const vy = (p.y - p.oy) * DAMPING;
      p.ox = p.x;
      p.oy = p.y;
      p.x += vx;
      p.y += vy + g;
    }
  }

  function satisfyConstraints() {
    for (let iter = 0; iter < CONSTRAINT_ITERS; iter++) {
      for (let s = 0; s < springs.length; s++) {
        const sp = springs[s];
        const pa = points[sp.a];
        const pb = points[sp.b];
        let dx = pb.x - pa.x;
        let dy = pb.y - pa.y;
        const dist = Math.hypot(dx, dy) || 0.0001;
        const diff = (dist - sp.rest) / dist;
        const k = sp.stiffness * 0.5;
        const ox = dx * diff * k;
        const oy = dy * diff * k;
        if (!pa.pinned) { pa.x += ox; pa.y += oy; }
        if (!pb.pinned) { pb.x -= ox; pb.y -= oy; }
      }
      const pad = 8;
      for (let i = 0; i < points.length; i++) {
        const p = points[i];
        if (p.pinned) continue;
        if (p.x < pad) p.x = pad;
        if (p.x > W - pad) p.x = W - pad;
        if (p.y < pad) p.y = pad;
        if (p.y > H - pad) {
          p.y = H - pad;
          p.oy = p.y;
        }
      }
    }
  }

  let dragging = false;
  let dragIndex = -1;
  let pointerId = null;
  const pointer = { x: 0, y: 0 };
  const DRAG_STIFFNESS = 0.45;

  function pointerPos(e) {
    const rect = canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }

  function nearestOuter(x, y) {
    let best = 1;
    let bestD = Infinity;
    for (let i = 1; i <= OUTER_N; i++) {
      const d = vdist(points[i], { x, y });
      if (d < bestD) { bestD = d; best = i; }
    }
    return best;
  }

  function applyDrag() {
    if (!dragging || dragIndex < 0) return;
    const p = points[dragIndex];
    const dx = pointer.x - p.x;
    const dy = pointer.y - p.y;
    p.x += dx * DRAG_STIFFNESS;
    p.y += dy * DRAG_STIFFNESS;
    p.ox = p.x - dx * 0.08;
    p.oy = p.y - dy * 0.08;
  }

  function onDown(e) {
    e.preventDefault();
    if (pointerId !== null && e.pointerId !== pointerId) return;
    pointerId = e.pointerId;
    canvas.setPointerCapture(pointerId);
    const pos = pointerPos(e);
    pointer.x = pos.x;
    pointer.y = pos.y;
    dragIndex = nearestOuter(pos.x, pos.y);
    dragging = true;
    if (!hintFading) {
      hintFading = true;
      hint.classList.add('fade');
    }
  }

  function onMove(e) {
    if (!dragging || e.pointerId !== pointerId) return;
    e.preventDefault();
    const pos = pointerPos(e);
    pointer.x = pos.x;
    pointer.y = pos.y;
  }

  function onUp(e) {
    if (e.pointerId !== pointerId) return;
    e.preventDefault();
    dragging = false;
    dragIndex = -1;
    try { canvas.releasePointerCapture(pointerId); } catch (_) {}
    pointerId = null;
  }

  canvas.addEventListener('pointerdown', onDown, { passive: false });
  canvas.addEventListener('pointermove', onMove, { passive: false });
  canvas.addEventListener('pointerup', onUp, { passive: false });
  canvas.addEventListener('pointercancel', onUp, { passive: false });

  // ----- Midpoint quadratic spline closure -----
  function strokeSoftBodyPath() {
    const n = OUTER_N;
    const mid = (i) => {
      const a = points[1 + i];
      const b = points[1 + ((i + 1) % n)];
      return { x: (a.x + b.x) * 0.5, y: (a.y + b.y) * 0.5 };
    };
    const first = mid(0);
    ctx.moveTo(first.x, first.y);
    for (let i = 0; i < n; i++) {
      const control = points[1 + ((i + 1) % n)];
      const end = mid((i + 1) % n);
      ctx.quadraticCurveTo(control.x, control.y, end.x, end.y);
    }
    ctx.closePath();
  }

  function avgSpokeRest() {
    let sum = 0;
    let count = 0;
    for (let i = 0; i < springs.length; i++) {
      const sp = springs[i];
      if (sp.a === 0) { sum += sp.rest; count++; }
    }
    return count ? sum / count : RADIUS();
  }

  function stretchRatio() {
    const rest = avgSpokeRest();
    let max = 0;
    for (let i = 1; i <= OUTER_N; i++) {
      const d = vdist(points[0], points[i]) / rest;
      if (d > max) max = d;
    }
    return max;
  }

  function drawEars(c) {
    const tipScale = 0.55;
    function ear(baseL, baseR) {
      const mx = (baseL.x + baseR.x) * 0.5;
      const my = (baseL.y + baseR.y) * 0.5;
      const nx = -(baseR.y - baseL.y);
      const ny = baseR.x - baseL.x;
      const nl = Math.hypot(nx, ny) || 1;
      const ux = nx / nl;
      const uy = ny / nl;
      // outward from center
      const toC = { x: mx - c.x, y: my - c.y };
      const sign = toC.x * ux + toC.y * uy < 0 ? -1 : 1;
      const tipX = mx + ux * sign * (avgSpokeRest() * tipScale);
      const tipY = my + uy * sign * (avgSpokeRest() * tipScale);
      ctx.beginPath();
      ctx.moveTo(baseL.x, baseL.y);
      ctx.lineTo(tipX, tipY);
      ctx.lineTo(baseR.x, baseR.y);
      ctx.closePath();
      ctx.fillStyle = COLORS.cat;
      ctx.fill();
      ctx.strokeStyle = 'rgba(255, 82, 119, 0.2)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      // inner ear
      ctx.beginPath();
      ctx.moveTo(
        baseL.x * 0.65 + tipX * 0.35,
        baseL.y * 0.65 + tipY * 0.35
      );
      ctx.lineTo(tipX * 0.85 + mx * 0.15, tipY * 0.85 + my * 0.15);
      ctx.lineTo(
        baseR.x * 0.65 + tipX * 0.35,
        baseR.y * 0.65 + tipY * 0.35
      );
      ctx.closePath();
      ctx.fillStyle = 'rgba(255, 82, 119, 0.35)';
      ctx.fill();
    }
    // ears from top-adjacent outer points: index 1 is top (-PI/2)
    ear(points[OUTER_N], points[1]);
    ear(points[1], points[2]);
  }

  function drawFace(c) {
    const lookTarget = dragging
      ? pointer
      : { x: c.x, y: c.y - 10 };
    let lx = lookTarget.x - c.x;
    let ly = lookTarget.y - c.y;
    const llen = Math.hypot(lx, ly) || 1;
    lx /= llen;
    ly /= llen;
    const lookAmt = 4.5;
    const stretch = stretchRatio();
    const squint = stretch > 1.45;

    const eyeY = c.y - 6 + ly * lookAmt * 0.3;
    const eyeSpread = 11;
    const eyeR = squint ? 2.2 : 3.6;
    const pupilR = squint ? 1.1 : 1.7;

    function eye(ex) {
      const ox = ex + lx * lookAmt;
      const oy = eyeY + ly * lookAmt * 0.35;
      ctx.beginPath();
      if (squint) {
        ctx.ellipse(ox, oy, eyeR * 1.6, eyeR * 0.55, 0, 0, Math.PI * 2);
      } else {
        ctx.arc(ox, oy, eyeR, 0, Math.PI * 2);
      }
      ctx.fillStyle = '#fff';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(ox + lx * 1.2, oy + ly * 1.2, pupilR, 0, Math.PI * 2);
      ctx.fillStyle = '#3a2a40';
      ctx.fill();
    }

    eye(c.x - eyeSpread);
    eye(c.x + eyeSpread);

    // nose
    ctx.beginPath();
    ctx.moveTo(c.x, c.y + 2);
    ctx.lineTo(c.x - 3.5, c.y + 7);
    ctx.lineTo(c.x + 3.5, c.y + 7);
    ctx.closePath();
    ctx.fillStyle = COLORS.face;
    ctx.fill();

    // mouth
    ctx.beginPath();
    ctx.strokeStyle = COLORS.face;
    ctx.lineWidth = 1.6;
    ctx.lineCap = 'round';
    if (squint) {
      ctx.arc(c.x, c.y + 12, 5, 0.15 * Math.PI, 0.85 * Math.PI);
    } else {
      ctx.moveTo(c.x - 5, c.y + 11);
      ctx.quadraticCurveTo(c.x, c.y + 15, c.x + 5, c.y + 11);
    }
    ctx.stroke();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = COLORS.bg;
    ctx.fillRect(0, 0, W, H);

    const c = points[0];
    drawEars(c);

    // body
    ctx.beginPath();
    strokeSoftBodyPath();
    const grad = ctx.createRadialGradient(c.x - 18, c.y - 22, 8, c.x, c.y, avgSpokeRest() * 1.2);
    grad.addColorStop(0, '#FFB4B4');
    grad.addColorStop(0.55, COLORS.cat);
    grad.addColorStop(1, COLORS.catDeep);
    ctx.fillStyle = grad;
    ctx.fill();

    // whipped-cream highlight
    ctx.beginPath();
    ctx.ellipse(c.x - 16, c.y - 20, 18, 12, -0.4, 0, Math.PI * 2);
    ctx.fillStyle = COLORS.highlight;
    ctx.fill();

    // soft rim
    ctx.beginPath();
    strokeSoftBodyPath();
    ctx.strokeStyle = 'rgba(255, 82, 119, 0.22)';
    ctx.lineWidth = 2;
    ctx.stroke();

    drawFace(c);
  }

  function frame(t) {
    if (!lastTime) lastTime = t;
    let dt = (t - lastTime) / 1000;
    lastTime = t;
    dt = Math.min(dt, 0.033);
    const dtScale = dt / (1 / 60);

    const steps = 2;
    for (let i = 0; i < steps; i++) {
      verletIntegrate(dtScale / steps);
      applyDrag();
      satisfyConstraints();
    }

    draw();
    requestAnimationFrame(frame);
  }

  function init() {
    resize();
    buildCat(W * 0.5, H * 0.38, RADIUS());
    lastTime = 0;
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', () => {
    const cx = points[0] ? points[0].x / (W || 1) : 0.5;
    const cy = points[0] ? points[0].y / (H || 1) : 0.38;
    resize();
    buildCat(
      Math.min(Math.max(cx * W, 40), W - 40),
      Math.min(Math.max(cy * H, 40), H - 40),
      RADIUS()
    );
  });

  window.__liquidCat = {
    version: 'step2',
    getPointCount: () => points.length,
    getOuterCount: () => OUTER_N,
    getCenter: () => ({ x: points[0].x, y: points[0].y }),
    isDragging: () => dragging,
    getDragIndex: () => dragIndex,
    getStretchRatio: () => stretchRatio(),
    sampleHullSmoothness: () => {
      // average exterior angle deviation — lower means smoother organic outline intent
      let sum = 0;
      for (let i = 0; i < OUTER_N; i++) {
        const a = points[1 + i];
        const b = points[1 + ((i + 1) % OUTER_N)];
        const c = points[1 + ((i + 2) % OUTER_N)];
        const abx = b.x - a.x, aby = b.y - a.y;
        const bcx = c.x - b.x, bcy = c.y - b.y;
        const dab = Math.hypot(abx, aby) || 1;
        const dbc = Math.hypot(bcx, bcy) || 1;
        const dot = (abx / dab) * (bcx / dbc) + (aby / dab) * (bcy / dbc);
        sum += Math.acos(Math.max(-1, Math.min(1, dot)));
      }
      return sum / OUTER_N;
    },
    getBounds: () => {
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      for (let i = 0; i < points.length; i++) {
        const p = points[i];
        if (p.x < minX) minX = p.x;
        if (p.y < minY) minY = p.y;
        if (p.x > maxX) maxX = p.x;
        if (p.y > maxY) maxY = p.y;
      }
      return { minX, minY, maxX, maxY };
    },
  };

  init();
})();
  </script>
</body>
</html>
