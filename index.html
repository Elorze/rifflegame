<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Sling-Cat: Liquid Cannon</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#F4F0FF;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
'use strict';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const N = 16, PI2 = Math.PI * 2, H120 = 1 / 120, DAMP = 0.9996, K = 12.5;
const cl = (v, a, b) => v < a ? a : v > b ? b : v;
const rnd = (a, b) => a + Math.random() * (b - a);
const MAC = ['#FF9EBB', '#9EE6CF', '#FFD58A', '#B9A6FF', '#8EC9FF', '#FFB3A7'];

let W = 0, H = 0, u = 1, dpr = 1, bgGrad = null;
let state = 'aim', stateT = 0, time = 0, shake = 0, score = 0, hintA = 1;
let dragging = false, flyT = 0, calmT = 0, impact = 0, thudCD = 0;
const A = { x: 0, y: 0 }, pull = { x: 0, y: 0 };
const V = { x: 0, hw: 0, t: 0, b: 0, th: 0, rects: [] };
const px = new Float64Array(N + 1), py = new Float64Array(N + 1);
const ox = new Float64Array(N + 1), oy = new Float64Array(N + 1);
let R = 30, S = 1, stars = [], conf = [], amb = [];

// constraints: [i, j, rest (in R units), stiffness]
const cons = [];
for (let k = 0; k < N; k++) {
  const i = k + 1, j = (k + 1) % N + 1, j2 = (k + 2) % N + 1;
  cons.push([i, j, 2 * Math.sin(Math.PI / N), 0.9]);
  cons.push([0, i, 1, 0.35]);
  cons.push([i, j2, 2 * Math.sin(2 * Math.PI / N), 0.35]);
}

/* ---------------- Audio (procedural, zero assets) ---------------- */
let ac = null, sOsc = null, sGain = null, nBuf = null;
function unlock() {
  try {
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      ac = new AC();
      nBuf = ac.createBuffer(1, ac.sampleRate * 0.2, ac.sampleRate);
      const d = nBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (ac.state === 'suspended') ac.resume();
  } catch (e) {}
}
function tone(type, f0, f1, dur, vol, delay) {
  if (!ac) return;
  const t = ac.currentTime + (delay || 0), o = ac.createOscillator(), g = ac.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + Math.min(dur, 0.12));
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(ac.destination);
  o.start(t); o.stop(t + dur + 0.05);
}
function thud(v) {
  if (!ac) return;
  const t = ac.currentTime, s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = nBuf; f.type = 'lowpass'; f.frequency.value = 260;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.5 * v + 0.05, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
  s.connect(f); f.connect(g); g.connect(ac.destination);
  s.start(t); s.stop(t + 0.2);
  tone('sine', 120, 60, 0.15, 0.25 * v + 0.03);
}
function startStretch() {
  if (!ac || sOsc) return;
  sOsc = ac.createOscillator(); sGain = ac.createGain();
  sOsc.type = 'sine'; sOsc.frequency.value = 100;
  sGain.gain.setValueAtTime(0.0001, ac.currentTime);
  sGain.gain.linearRampToValueAtTime(0.06, ac.currentTime + 0.05);
  sOsc.connect(sGain); sGain.connect(ac.destination); sOsc.start();
}
function setStretch(t) { if (sOsc) sOsc.frequency.setTargetAtTime(100 + 180 * t, ac.currentTime, 0.03); }
function stopStretch() {
  if (!sOsc) return;
  const o = sOsc, g = sGain; sOsc = null;
  g.gain.cancelScheduledValues(ac.currentTime);
  g.gain.setValueAtTime(Math.max(g.gain.value, 0.0001), ac.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + 0.06);
  o.stop(ac.currentTime + 0.08);
}
function winSound() {
  tone('sine', 180, 900, 0.14, 0.4);
  tone('sine', 1046.5, 1046.5, 0.9, 0.16, 0.06);
  tone('sine', 1568, 1568, 0.9, 0.12, 0.06);
}

/* ---------------- Setup ---------------- */
function initCat() {
  R = 34 * u; S = 1;
  px[0] = A.x; py[0] = A.y;
  for (let k = 0; k < N; k++) {
    const a = k / N * PI2;
    px[k + 1] = A.x + Math.cos(a) * R; py[k + 1] = A.y + Math.sin(a) * R;
  }
  for (let i = 0; i <= N; i++) { ox[i] = px[i]; oy[i] = py[i]; }
}
function placeVase() {
  V.hw = 52 * u; V.th = 6 * u;
  V.t = H * rnd(0.22, 0.3); V.b = V.t + 135 * u;
  const m = V.hw + V.th + 10 * u;
  V.x = rnd(Math.max(m, W * 0.3), Math.min(W - m, W * 0.7));
  const r = 4 * u, x0 = V.x - V.hw, x1 = V.x + V.hw;
  V.rects = [
    [x0 - V.th - r, V.t - r, x0 + r, V.b + V.th + r],
    [x1 - r, V.t - r, x1 + V.th + r, V.b + V.th + r],
    [x0 - V.th - r, V.b - r, x1 + V.th + r, V.b + V.th + r]
  ];
}
function resetRound(newVase) {
  state = 'aim'; stateT = 0; flyT = 0; calmT = 0;
  initCat();
  if (newVase) placeVase();
}
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  u = cl(Math.min(W, H * 0.55) / 390, 0.55, 1.7);
  A.x = W / 2; A.y = H * 0.8;
  bgGrad = ctx.createLinearGradient(0, 0, 0, H);
  bgGrad.addColorStop(0, '#F4F0FF'); bgGrad.addColorStop(1, '#FFE0EA');
  stars = []; amb = [];
  for (let i = 0; i < 36; i++) stars.push({ x: rnd(0, W), y: rnd(0, H), r: rnd(2, 5) * u, ph: rnd(0, PI2) });
  for (let i = 0; i < 20; i++) amb.push({ x: rnd(0, W), y: rnd(0, H), vy: rnd(8, 22) * u, rot: rnd(0, PI2), vr: rnd(-1, 1), size: rnd(5, 10) * u, color: MAC[i % 6], shape: i % 3 });
  if (state === 'aim' || state === 'pull') { dragging = false; resetRound(true); }
  else placeVase();
}

/* ---------------- Physics ---------------- */
function area() {
  let a = 0;
  for (let k = 0; k < N; k++) {
    const i = k + 1, j = (k + 1) % N + 1;
    a += px[i] * py[j] - px[j] * py[i];
  }
  return a / 2;
}
function hit(i, nx, ny, pen) {
  const vx = px[i] - ox[i], vy = py[i] - oy[i];
  px[i] += nx * pen; py[i] += ny * pen;
  const vn = vx * nx + vy * ny;
  if (vn < 0) {
    const nvx = (vx - vn * nx) * 0.92 - vn * nx * 0.25;
    const nvy = (vy - vn * ny) * 0.92 - vn * ny * 0.25;
    ox[i] = px[i] - nvx; oy[i] = py[i] - nvy;
    impact = Math.max(impact, -vn / H120);
  }
}
function collide() {
  const r = 4 * u;
  for (let i = 0; i <= N; i++) {
    if (px[i] < r) hit(i, 1, 0, r - px[i]);
    else if (px[i] > W - r) hit(i, -1, 0, px[i] - (W - r));
    if (py[i] > H - r) hit(i, 0, -1, py[i] - (H - r));
    for (const q of V.rects) {
      const x = px[i], y = py[i];
      if (x > q[0] && x < q[2] && y > q[1] && y < q[3]) {
        const a = x - q[0], b = q[2] - x, c = y - q[1], d = q[3] - y, m = Math.min(a, b, c, d);
        if (m === a) hit(i, -1, 0, a); else if (m === b) hit(i, 1, 0, b);
        else if (m === c) hit(i, 0, -1, c); else hit(i, 0, 1, d);
      }
    }
  }
}
function com() {
  let x = 0, y = 0;
  for (let i = 0; i <= N; i++) { x += px[i]; y += py[i]; }
  return { x: x / (N + 1), y: y / (N + 1) };
}
function step(h) {
  const hh = h * h, g = 1150 * u, pinned = state === 'aim' || state === 'pull';
  const c = com();
  let vcx = 0, vcy = 0;
  for (let i = 0; i <= N; i++) { vcx += px[i] - ox[i]; vcy += py[i] - oy[i]; }
  vcx /= N + 1; vcy /= N + 1;
  let fx = 0, fy = 0;
  // Funnel / vortex attraction field around the vase mouth
  if (state === 'fly') {
    const tx = V.x, ty = V.t + 24 * u, dx = tx - c.x, dy = ty - c.y, d = Math.hypot(dx, dy), D = 1.3 * V.hw * 2;
    if (c.y < V.t + 10 * u && d < D && vcy / h > -80 * u) {
      const w = 1 - d / D, f = 3400 * u * w * w;
      fx += dx / (d || 1) * f; fy += dy / (d || 1) * f;
      fx += -dy / (d || 1) * f * 0.15; // slight swirl
    } else if (Math.abs(c.x - V.x) < V.hw && c.y > V.t && c.y < V.b) {
      fx += (V.x - c.x) * 18;
    }
  }
  for (let i = 0; i <= N; i++) {
    const x = px[i], y = py[i];
    px[i] = x + (x - ox[i]) * DAMP + fx * hh;
    py[i] = y + (y - oy[i]) * DAMP + (g + fy) * hh;
    ox[i] = x; oy[i] = y;
  }
  if (pinned) {
    const t = state === 'pull' ? pull : { x: A.x, y: A.y + Math.sin(time * 2.2) * 2 * u };
    px[0] += (t.x - px[0]) * 0.4; py[0] += (t.y - py[0]) * 0.4;
    ox[0] = px[0]; oy[0] = py[0];
  }
  if (state === 'win') S += ((V.hw * 0.9) / R - S) * Math.min(1, h * 9);
  const rs = R * S, tgt = 0.5 * N * Math.sin(PI2 / N) * rs * rs;
  for (let it = 0; it < 4; it++) {
    for (const [i, j, rest, k] of cons) {
      const dx = px[j] - px[i], dy = py[j] - py[i], d = Math.hypot(dx, dy) || 1e-6;
      const diff = (d - rest * rs) / d * k;
      const wi = (i === 0 && pinned) ? 0 : 1, wj = (j === 0 && pinned) ? 0 : 1, sw = wi + wj;
      if (!sw) continue;
      px[i] += dx * diff * wi / sw; py[i] += dy * diff * wi / sw;
      px[j] -= dx * diff * wj / sw; py[j] -= dy * diff * wj / sw;
    }
    // Area preservation (shoelace) along surface normals
    const a = area();
    if (a > 0 && a < tgt) {
      const dd = (tgt - a) / (N * 2 * rs * Math.sin(Math.PI / N)) * 0.5;
      for (let k = 0; k < N; k++) {
        const i = k + 1, p = (k + N - 1) % N + 1, n = (k + 1) % N + 1;
        const tx = px[n] - px[p], ty = py[n] - py[p], l = Math.hypot(tx, ty) || 1;
        px[i] += ty / l * dd; py[i] -= tx / l * dd;
      }
    }
  }
  collide();
  // damp internal jiggle modes (keeps jelly wobble from ringing forever)
  let ax = 0, ay = 0;
  for (let i = 0; i <= N; i++) { ax += px[i] - ox[i]; ay += py[i] - oy[i]; }
  ax /= N + 1; ay /= N + 1;
  for (let i = 0; i <= N; i++) {
    const vx = ax + (px[i] - ox[i] - ax) * 0.985, vy = ay + (py[i] - oy[i] - ay) * 0.985;
    ox[i] = px[i] - vx; oy[i] = py[i] - vy;
  }
}

/* ---------------- Game flow ---------------- */
function launch() {
  const vx = (A.x - pull.x) * K, vy = (A.y - pull.y) * K;
  for (let i = 0; i <= N; i++) { ox[i] = px[i] - vx * H120; oy[i] = py[i] - vy * H120; }
  state = 'fly'; stateT = 0; flyT = 0; calmT = 0; hintA = Math.min(hintA, 0.99);
  tone('sine', 320, 110, 0.14, 0.16);
}
function inVase() {
  let n = 0;
  for (let i = 0; i <= N; i++)
    if (px[i] > V.x - V.hw && px[i] < V.x + V.hw && py[i] > V.t && py[i] < V.b) n++;
  return n;
}
function win() {
  state = 'win'; stateT = 0; score++; shake = 1;
  winSound();
  for (let i = 0; i < 90; i++)
    conf.push({ x: V.x + rnd(-V.hw, V.hw), y: V.t, vx: rnd(-420, 420) * u, vy: -rnd(300, 900) * u, rot: rnd(0, PI2), vr: rnd(-8, 8), size: rnd(7, 14) * u, color: MAC[i % 6], shape: i % 3, life: 1 });
}
function update(dt) {
  stateT += dt; thudCD -= dt;
  shake = Math.max(0, shake - dt * 2.5);
  if (impact > 380 * u && thudCD <= 0) { thud(Math.min(1, impact / (1300 * u))); thudCD = 0.09; }
  impact = 0;
  for (let i = conf.length - 1; i >= 0; i--) {
    const p = conf[i];
    p.vy += 900 * u * dt; p.vx *= 1 - 1.2 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    if (p.y > H + 30) conf.splice(i, 1);
  }
  for (const p of amb) { p.y += p.vy * dt; p.rot += p.vr * dt; if (p.y > H + 10) { p.y = -10; p.x = rnd(0, W); } }
  if (state === 'fly') {
    flyT += dt;
    if (inVase() >= Math.ceil(0.8 * (N + 1))) { win(); return; }
    const c = com(), sp = Math.hypot(px[0] - ox[0], py[0] - oy[0]) / H120;
    calmT = (sp < 60 * u && c.y > H * 0.8) ? calmT + dt : 0;
    if (calmT > 0.9 || flyT > 7) resetRound(false);
  } else if (state === 'win' && stateT > 2.5) resetRound(true);
}

/* ---------------- Rendering ---------------- */
function starP(x, y, r, rot) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = rot + i * Math.PI / 5 - Math.PI / 2, d = i % 2 ? r * 0.45 : r;
    ctx.lineTo(x + Math.cos(a) * d, y + Math.sin(a) * d);
  }
  ctx.closePath();
}
function piece(p, alpha) {
  ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
  ctx.globalAlpha = alpha; ctx.fillStyle = p.color;
  if (p.shape === 0) { starP(0, 0, p.size, 0); ctx.fill(); }
  else if (p.shape === 1) { ctx.beginPath(); ctx.ellipse(0, 0, p.size * 0.5, p.size * 0.9, 0, 0, PI2); ctx.fill(); }
  else ctx.fillRect(-p.size / 2, -p.size * 0.35, p.size, p.size * 0.7);
  ctx.restore();
}
function drawBg() {
  ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, W, H);
  for (const s of stars) {
    ctx.globalAlpha = 0.35 + 0.35 * Math.sin(time * 1.6 + s.ph);
    ctx.fillStyle = '#FFFFFF'; starP(s.x, s.y, s.r, 0); ctx.fill();
  }
  for (const p of amb) piece(p, 0.45);
  ctx.globalAlpha = 1;
  ctx.fillStyle = 'rgba(255,255,255,0.45)';
  ctx.beginPath(); ctx.ellipse(W / 2, H + 40 * u, W * 0.8, 90 * u, 0, 0, PI2); ctx.fill();
}
function vasePath() {
  const x0 = V.x - V.hw, x1 = V.x + V.hw, r = 14 * u;
  ctx.beginPath(); ctx.moveTo(x0, V.t); ctx.lineTo(x0, V.b - r);
  ctx.quadraticCurveTo(x0, V.b, x0 + r, V.b); ctx.lineTo(x1 - r, V.b);
  ctx.quadraticCurveTo(x1, V.b, x1, V.b - r); ctx.lineTo(x1, V.t);
}
function vaseBack() {
  ctx.save();
  ctx.shadowColor = 'rgba(70,160,140,0.35)'; ctx.shadowBlur = 24 * u; ctx.shadowOffsetY = 14 * u;
  ctx.fillStyle = 'rgba(112,214,188,0.25)';
  ctx.beginPath(); ctx.ellipse(V.x, V.b + 6 * u, V.hw * 0.9, 9 * u, 0, 0, PI2); ctx.fill();
  ctx.restore();
  ctx.fillStyle = 'rgba(112,214,188,0.2)';
  ctx.beginPath(); ctx.ellipse(V.x, V.t, V.hw, 10 * u, 0, 0, PI2); ctx.fill();
  ctx.strokeStyle = '#70D6BC'; ctx.lineWidth = 6 * u;
  ctx.beginPath(); ctx.ellipse(V.x, V.t, V.hw + 3 * u, 10 * u, 0, Math.PI, PI2); ctx.stroke();
}
function vaseFront() {
  vasePath();
  ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fill();
  ctx.strokeStyle = '#70D6BC'; ctx.lineWidth = 6 * u; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke();
  ctx.beginPath(); ctx.ellipse(V.x, V.t, V.hw + 3 * u, 10 * u, 0, 0, Math.PI); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 3 * u;
  ctx.beginPath(); ctx.ellipse(V.x, V.t, V.hw - 2 * u, 7 * u, 0, Math.PI * 0.08, Math.PI * 0.45); ctx.stroke();
  ctx.lineWidth = 5 * u; ctx.strokeStyle = 'rgba(255,255,255,0.55)';
  ctx.beginPath(); ctx.moveTo(V.x - V.hw + 12 * u, V.t + 26 * u); ctx.lineTo(V.x - V.hw + 12 * u, V.b - 34 * u); ctx.stroke();
  ctx.lineWidth = 3 * u;
  ctx.beginPath(); ctx.moveTo(V.x - V.hw + 12 * u, V.b - 22 * u); ctx.lineTo(V.x - V.hw + 12 * u, V.b - 18 * u); ctx.stroke();
}
function fork() {
  const x = A.x, y = A.y;
  const path = (dx) => {
    ctx.beginPath();
    ctx.moveTo(x + dx, y + 125 * u); ctx.lineTo(x + dx, y + 50 * u);
    ctx.moveTo(x + dx, y + 54 * u); ctx.lineTo(x + dx - 40 * u, y - 14 * u);
    ctx.moveTo(x + dx, y + 54 * u); ctx.lineTo(x + dx + 40 * u, y - 14 * u);
  };
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = '#9A6238'; ctx.lineWidth = 18 * u; path(0); ctx.stroke();
  ctx.strokeStyle = '#C98D57'; ctx.lineWidth = 11 * u; path(0); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 3 * u; path(-2 * u); ctx.stroke();
}
function band(c, rr, side, t) {
  ctx.strokeStyle = '#8E6BFF'; ctx.lineWidth = (8 - 3 * t) * u; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(A.x + side * 40 * u, A.y - 14 * u);
  ctx.lineTo(c.x + side * rr * 0.75, c.y + rr * 0.1); ctx.stroke();
}
function ear(c, rr, ang, inner) {
  const dx = Math.cos(ang), dy = Math.sin(ang), nx = -dy, ny = dx;
  const bd = inner ? 0.85 : 0.72, hw = rr * (inner ? 0.2 : 0.38), td = rr * (inner ? 1.3 : 1.5);
  const bx = c.x + dx * rr * bd, by = c.y + dy * rr * bd, tx = c.x + dx * td, ty = c.y + dy * td;
  const L = td - rr * bd;
  ctx.beginPath();
  ctx.moveTo(bx - nx * hw, by - ny * hw);
  ctx.bezierCurveTo(bx - nx * hw + dx * L * 0.75, by - ny * hw + dy * L * 0.75, tx - nx * hw * 0.5, ty - ny * hw * 0.5, tx, ty);
  ctx.bezierCurveTo(tx + nx * hw * 0.5, ty + ny * hw * 0.5, bx + nx * hw + dx * L * 0.75, by + ny * hw + dy * L * 0.75, bx + nx * hw, by + ny * hw);
  ctx.closePath();
  ctx.fillStyle = inner ? '#FFC9D6' : '#FF7A97'; ctx.fill();
  if (!inner) { ctx.strokeStyle = '#E04868'; ctx.lineWidth = 4 * u; ctx.lineJoin = 'round'; ctx.stroke(); }
}
function face(k, mode) {
  const dark = '#3A2340', mouth = '#7A2E45';
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.fillStyle = 'rgba(255,100,140,0.45)';
  for (const s of [-1, 1]) { ctx.beginPath(); ctx.ellipse(s * 0.62 * k, 0.2 * k, 0.13 * k, 0.08 * k, 0, 0, PI2); ctx.fill(); }
  ctx.strokeStyle = dark; ctx.lineWidth = 0.065 * k;
  for (const s of [-1, 1]) {
    const ex = s * 0.36 * k;
    if (mode === 'pull') {
      ctx.beginPath(); ctx.moveTo(ex - s * 0.14 * k, -0.14 * k); ctx.lineTo(ex + s * 0.1 * k, -0.02 * k); ctx.lineTo(ex - s * 0.14 * k, 0.1 * k); ctx.stroke();
    } else if (mode === 'win') {
      ctx.beginPath(); ctx.arc(ex, 0.03 * k, 0.12 * k, Math.PI, PI2); ctx.stroke();
    } else {
      const big = mode === 'fly' ? 1.15 : 1;
      ctx.fillStyle = dark; ctx.beginPath(); ctx.ellipse(ex, -0.02 * k, 0.12 * k * big, 0.15 * k * big, 0, 0, PI2); ctx.fill();
      ctx.fillStyle = '#fff';

/* ---------------- Input ---------------- */
function pt(e) { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
