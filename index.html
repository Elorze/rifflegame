<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Liquid Cat — Riffle Demo</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #F4F0FF;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: grab;
    }
    canvas:active { cursor: grabbing; }
    #hint {
      position: fixed;
      left: 50%;
      top: 10%;
      transform: translateX(-50%);
      color: rgba(80, 60, 100, 0.55);
      font-size: 14px;
      letter-spacing: 0.02em;
      pointer-events: none;
      opacity: 1;
      transition: opacity 0.8s ease;
      white-space: nowrap;
      z-index: 2;
    }
    #hint.fade { opacity: 0; }
    #burst {
      position: fixed;
      left: 50%;
      top: 42%;
      transform: translate(-50%, -50%) scale(0.6);
      color: #FF5277;
      font-size: 42px;
      font-weight: 800;
      letter-spacing: 0.04em;
      pointer-events: none;
      opacity: 0;
      z-index: 3;
      text-shadow: 0 4px 18px rgba(255, 158, 158, 0.55);
      transition: opacity 0.15s ease, transform 0.25s cubic-bezier(0.2, 1.4, 0.3, 1);
    }
    #burst.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }
  </style>
</head>
<body>
  <div id="hint">Squish the cat into the glass!</div>
  <div id="burst">POP!</div>
  <canvas id="c"></canvas>
  <script>
(function () {
  'use strict';

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const hint = document.getElementById('hint');
  const burstEl = document.getElementById('burst');

  const COLORS = {
    bg: '#F4F0FF',
    cat: '#FF9E9E',
    catDeep: '#FF8585',
    face: '#FF5277',
    highlight: 'rgba(255,255,255,0.4)',
    glass: 'rgba(112, 214, 188, 0.55)',
    glassFill: 'rgba(112, 214, 188, 0.08)',
    lock: '#38EF7D',
    confetti: ['#FFD166', '#06D6A0', '#118AB2', '#EF476F', '#FF9E9E'],
  };

  let W = 0, H = 0, dpr = 1;
  let lastTime = 0;
  let hintFading = false;
  let shake = 0;
  let celebrating = false;
  let celebrateTimer = 0;
  let fillHold = 0;
  let containerIndex = 0;
  let targetArea = 1;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function vdist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

  // ========== SoundEngine ==========
  const Sound = (function () {
    let ctxAudio = null;
    let unlocked = false;

    function ensure() {
      if (!ctxAudio) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        ctxAudio = new AC();
      }
      return ctxAudio;
    }

    async function unlock() {
      const a = ensure();
      if (!a) return;
      if (a.state === 'suspended') {
        try { await a.resume(); } catch (_) {}
      }
      unlocked = a.state === 'running';
    }

    function envGain(a, peak, attack, release) {
      const g = a.createGain();
      const t = a.currentTime;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(Math.max(0.0001, peak), t + attack);
      g.gain.exponentialRampToValueAtTime(0.0001, t + attack + release);
      return g;
    }

    function playSquish(intensity) {
      const a = ensure();
      if (!a || !unlocked) return;
      const osc = a.createOscillator();
      const filter = a.createBiquadFilter();
      const g = envGain(a, 0.12 * Math.min(1, intensity), 0.01, 0.08);
      osc.type = 'sine';
      const t = a.currentTime;
      osc.frequency.setValueAtTime(150, t);
      osc.frequency.exponentialRampToValueAtTime(55, t + 0.06);
      filter.type = 'lowpass';
      filter.frequency.value = 380;
      osc.connect(filter);
      filter.connect(g);
      g.connect(a.destination);
      osc.start(t);
      osc.stop(t + 0.12);
    }

    function playThud() {
      const a = ensure();
      if (!a || !unlocked) return;
      const osc = a.createOscillator();
      const g = envGain(a, 0.28, 0.005, 0.05);
      osc.type = 'triangle';
      const t = a.currentTime;
      osc.frequency.setValueAtTime(90, t);
      osc.frequency.exponentialRampToValueAtTime(30, t + 0.04);
      osc.connect(g);
      g.connect(a.destination);
      osc.start(t);
      osc.stop(t + 0.08);
    }

    function playPop() {
      const a = ensure();
      if (!a || !unlocked) return;
      const osc = a.createOscillator();
      const g = envGain(a, 0.35, 0.005, 0.08);
      osc.type = 'sine';
      const t = a.currentTime;
      osc.frequency.setValueAtTime(180, t);
      osc.frequency.exponentialRampToValueAtTime(850, t + 0.02);
      osc.frequency.exponentialRampToValueAtTime(200, t + 0.07);
      osc.connect(g);
      g.connect(a.destination);
      osc.start(t);
      osc.stop(t + 0.1);
    }

    function playChime() {
      const a = ensure();
      if (!a || !unlocked) return;
      const t = a.currentTime;
      [1046.5, 1567.9].forEach((f, i) => {
        const osc = a.createOscillator();
        const g = envGain(a, 0.18, 0.01, 0.55);
        osc.type = 'sine';
        osc.frequency.value = f;
        osc.connect(g);
        g.connect(a.destination);
        osc.start(t + i * 0.02);
        osc.stop(t + 0.7);
      });
    }

    return { unlock, playSquish, playThud, playPop, playChime, isUnlocked: () => unlocked };
  })();

  // ========== Particles ==========
  /** @type {{x:number,y:number,vx:number,vy:number,life:number,color:string,size:number,rot:number,vr:number}[]} */
  let particles = [];

  function spawnConfetti(x, y, n) {
    for (let i = 0; i < n; i++) {
      const ang = Math.random() * Math.PI * 2;
      const spd = 3 + Math.random() * 7;
      particles.push({
        x, y,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd - 4,
        life: 0.9 + Math.random() * 0.6,
        color: COLORS.confetti[(Math.random() * COLORS.confetti.length) | 0],
        size: 3 + Math.random() * 4,
        rot: Math.random() * Math.PI,
        vr: (Math.random() - 0.5) * 0.4,
      });
    }
  }

  function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life -= dt;
      p.vy += 18 * dt;
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vr;
      p.vx *= 0.99;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }

  function drawParticles() {
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life));
      ctx.fillStyle = p.color;
      if (i % 2 === 0) {
        ctx.fillRect(-p.size * 0.5, -p.size * 0.3, p.size, p.size * 0.6);
      } else {
        ctx.beginPath();
        ctx.arc(0, 0, p.size * 0.45, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  // ========== Soft body ==========
  const OUTER_N = 16;
  const CONSTRAINT_ITERS = 5;
  const DAMPING = 0.986;
  const GRAVITY = 0.16;
  const RADIUS = () => Math.min(W, H) * 0.145;

  /** @type {{x:number,y:number,ox:number,oy:number,pinned:boolean}[]} */
  let points = [];
  /** @type {{a:number,b:number,rest:number,stiffness:number}[]} */
  let springs = [];

  function makePoint(x, y) {
    return { x, y, ox: x, oy: y, pinned: false };
  }

  function buildCat(cx, cy, r) {
    points = [];
    springs = [];
    points.push(makePoint(cx, cy));
    for (let i = 0; i < OUTER_N; i++) {
      const a = (i / OUTER_N) * Math.PI * 2 - Math.PI / 2;
      points.push(makePoint(cx + Math.cos(a) * r, cy + Math.sin(a) * r));
    }
    for (let i = 0; i < OUTER_N; i++) {
      const a = 1 + i;
      const b = 1 + ((i + 1) % OUTER_N);
      springs.push({ a, b, rest: vdist(points[a], points[b]), stiffness: 0.58 });
      springs.push({ a: 0, b: a, rest: r, stiffness: 0.38 });
      const c = 1 + ((i + 2) % OUTER_N);
      springs.push({ a, b: c, rest: vdist(points[a], points[c]), stiffness: 0.24 });
    }
    targetArea = shoelaceArea();
  }

  function shoelaceArea() {
    let area = 0;
    for (let i = 0; i < OUTER_N; i++) {
      const p = points[1 + i];
      const q = points[1 + ((i + 1) % OUTER_N)];
      area += p.x * q.y - q.x * p.y;
    }
    return Math.abs(area) * 0.5;
  }

  function applyAreaPressure() {
    const area = shoelaceArea();
    if (targetArea <= 0) return;
    const deficit = (targetArea - area) / targetArea;
    if (deficit <= 0.02) return;
    const pressure = Math.min(0.55, deficit * 0.85);
    const c = points[0];
    for (let i = 1; i <= OUTER_N; i++) {
      const p = points[i];
      let nx = p.x - c.x;
      let ny = p.y - c.y;
      const len = Math.hypot(nx, ny) || 1;
      nx /= len; ny /= len;
      p.x += nx * pressure * 2.2;
      p.y += ny * pressure * 2.2;
    }
  }

  function verletIntegrate(dtScale) {
    const g = GRAVITY * dtScale * dtScale;
    for (let i = 0; i < points.length; i++) {
      const p = points[i];
      if (p.pinned) continue;
      const vx = (p.x - p.ox) * DAMPING;
      const vy = (p.y - p.oy) * DAMPING;
      p.ox = p.x;
      p.oy = p.y;
      p.x += vx;
      p.y += vy + g;
    }
  }

  // ========== Containers (segment arrays) ==========
  /** @type {{id:string, segments:{ax:number,ay:number,bx:number,by:number}[], neckY:number, path:{x:number,y:number}[], cx:number, mouthX:number, mouthY:number, mouthW:number}} */
  let container = null;

  function buildGoblet() {
    const cx = W * 0.5;
    const baseY = H * 0.92;
    const topY = H * 0.52;
    const neckY = H * 0.62;
    const bowlY = H * 0.78;
    const rimW = Math.min(W, H) * 0.13;
    const neckW = Math.min(W, H) * 0.055;
    const bowlW = Math.min(W, H) * 0.16;
    const bottomW = Math.min(W, H) * 0.14;

    const L = [
      { x: cx - rimW, y: topY },
      { x: cx - neckW, y: neckY },
      { x: cx - bowlW, y: bowlY },
      { x: cx - bottomW, y: baseY },
    ];
    const R = [
      { x: cx + bottomW, y: baseY },
      { x: cx + bowlW, y: bowlY },
      { x: cx + neckW, y: neckY },
      { x: cx + rimW, y: topY },
    ];
    const path = L.concat(R);
    const segments = [];
    for (let i = 0; i < L.length - 1; i++) {
      segments.push({ ax: L[i].x, ay: L[i].y, bx: L[i + 1].x, by: L[i + 1].y });
    }
    segments.push({ ax: L[L.length - 1].x, ay: L[L.length - 1].y, bx: R[0].x, by: R[0].y });
    for (let i = 0; i < R.length - 1; i++) {
      segments.push({ ax: R[i].x, ay: R[i].y, bx: R[i + 1].x, by: R[i + 1].y });
    }
    return {
      id: 'goblet',
      segments,
      neckY,
      path,
      cx,
      mouthX: cx,
      mouthY: topY,
      mouthW: rimW * 2,
    };
  }

  function buildBeaker() {
    const cx = W * 0.5;
    const topY = H * 0.55;
    const baseY = H * 0.90;
    const half = Math.min(W, H) * 0.17;
    const path = [
      { x: cx - half, y: topY },
      { x: cx - half, y: baseY },
      { x: cx + half, y: baseY },
      { x: cx + half, y: topY },
    ];
    const segments = [
      { ax: cx - half, ay: topY, bx: cx - half, by: baseY },
      { ax: cx - half, ay: baseY, bx: cx + half, by: baseY },
      { ax: cx + half, ay: baseY, bx: cx + half, by: topY },
    ];
    return {
      id: 'beaker',
      segments,
      neckY: topY + (baseY - topY) * 0.12,
      path,
      cx,
      mouthX: cx,
      mouthY: topY,
      mouthW: half * 2,
    };
  }

  const builders = [buildGoblet, buildBeaker];

  function setContainer(index) {
    containerIndex = ((index % builders.length) + builders.length) % builders.length;
    container = builders[containerIndex]();
  }

  function projectPointSegment(px, py, ax, ay, bx, by) {
    const abx = bx - ax, aby = by - ay;
    const apx = px - ax, apy = py - ay;
    const ab2 = abx * abx + aby * aby || 1;
    let t = (apx * abx + apy * aby) / ab2;
    t = Math.max(0, Math.min(1, t));
    const qx = ax + abx * t;
    const qy = ay + aby * t;
    const dx = px - qx, dy = py - qy;
    return { qx, qy, dx, dy, dist: Math.hypot(dx, dy), t };
  }

  let thudCooldown = 0;

  /** Left/right inner x at a given y from wall segments (envelope clamp). */
  function vesselBoundsAtY(y) {
    let left = -Infinity;
    let right = Infinity;
    let bottom = -Infinity;
    for (let s = 0; s < container.segments.length; s++) {
      const seg = container.segments[s];
      const ax = seg.ax, ay = seg.ay, bx = seg.bx, by = seg.by;
      // horizontal bottom
      if (Math.abs(ay - by) < 0.5) {
        bottom = Math.max(bottom, ay);
        continue;
      }
      const minY = Math.min(ay, by);
      const maxY = Math.max(ay, by);
      if (y < minY - 0.5 || y > maxY + 0.5) continue;
      const t = (y - ay) / ((by - ay) || 1e-6);
      const x = ax + (bx - ax) * t;
      if (x < container.cx) left = Math.max(left, x);
      else right = Math.min(right, x);
    }
    if (left === -Infinity) left = container.cx - container.mouthW * 0.5;
    if (right === Infinity) right = container.cx + container.mouthW * 0.5;
    if (bottom === -Infinity) bottom = H * 0.92;
    return { left, right, bottom };
  }

  function collideContainer() {
    if (!container) return;
    const inset = 3;
    const mouthHalf = container.mouthW * 0.55;
    for (let i = 0; i < points.length; i++) {
      const p = points[i];
      if (p.y < container.mouthY) continue;

      const inMouthLane = Math.abs(p.x - container.cx) <= mouthHalf;
      const inside = pointInVessel(p.x, p.y);
      if (!inside && !inMouthLane) continue;

      const prevX = p.x;
      const prevY = p.y;
      const b = vesselBoundsAtY(p.y);
      let hitWall = false;

      if (p.x < b.left + inset) {
        p.x = b.left + inset;
        hitWall = true;
      } else if (p.x > b.right - inset) {
        p.x = b.right - inset;
        hitWall = true;
      }
      if (p.y > b.bottom - inset) {
        p.y = b.bottom - inset;
        hitWall = true;
      }

      if (hitWall) {
        const speed = Math.hypot(prevX - p.ox, prevY - p.oy);
        p.ox = p.x - (p.x - p.ox) * 0.55;
        p.oy = p.y - (p.y - p.oy) * 0.55;
        if (thudCooldown <= 0 && speed > 2.8) {
          Sound.playThud();
          thudCooldown = 0.12;
        }
      }
    }
  }

  function pointInVessel(x, y) {
    if (!container) return false;
    if (y < container.mouthY) return false;
    // ray cast against closed path (path is open at top — close virtually)
    const poly = container.path;
    let inside = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; i++) {
      const xi = poly[i].x, yi = poly[i].y;
      const xj = poly[j].x, yj = poly[j].y;
      const intersect = ((yi > y) !== (yj > y)) &&
        (x < (xj - xi) * (y - yi) / ((yj - yi) || 1e-6) + xi);
      if (intersect) inside = !inside;
      j = i;
    }
    return inside;
  }

  function satisfyConstraints() {
    for (let iter = 0; iter < CONSTRAINT_ITERS; iter++) {
      for (let s = 0; s < springs.length; s++) {
        const sp = springs[s];
        const pa = points[sp.a];
        const pb = points[sp.b];
        const dx = pb.x - pa.x;
        const dy = pb.y - pa.y;
        const dist = Math.hypot(dx, dy) || 0.0001;
        const diff = (dist - sp.rest) / dist;
        const k = sp.stiffness * 0.5;
        const ox = dx * diff * k;
        const oy = dy * diff * k;
        if (!pa.pinned) { pa.x += ox; pa.y += oy; }
        if (!pb.pinned) { pb.x -= ox; pb.y -= oy; }
      }
      applyAreaPressure();
      collideContainer();

      const pad = 6;
      for (let i = 0; i < points.length; i++) {
        const p = points[i];
        if (p.pinned) continue;
        if (p.x < pad) p.x = pad;
        if (p.x > W - pad) p.x = W - pad;
        if (p.y < pad) p.y = pad;
        if (p.y > H - pad) {
          p.y = H - pad;
          p.oy = p.y;
        }
      }
    }
  }

  function fillRatio() {
    if (!container) return 0;
    let inside = 0;
    for (let i = 1; i <= OUTER_N; i++) {
      const p = points[i];
      if (p.y >= container.neckY && pointInVessel(p.x, p.y)) inside++;
    }
    return inside / OUTER_N;
  }

  // ========== Drag ==========
  let dragging = false;
  let dragIndex = -1;
  let pointerId = null;
  const pointer = { x: 0, y: 0 };
  const DRAG_STIFFNESS = 0.48;
  let squishCooldown = 0;

  function pointerPos(e) {
    const rect = canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }

  function nearestOuter(x, y) {
    let best = 1;
    let bestD = Infinity;
    for (let i = 1; i <= OUTER_N; i++) {
      const d = vdist(points[i], { x, y });
      if (d < bestD) { bestD = d; best = i; }
    }
    return best;
  }

  function applyDrag() {
    if (!dragging || dragIndex < 0 || celebrating) return;
    const p = points[dragIndex];
    const dx = pointer.x - p.x;
    const dy = pointer.y - p.y;
    p.x += dx * DRAG_STIFFNESS;
    p.y += dy * DRAG_STIFFNESS;
    p.ox = p.x - dx * 0.08;
    p.oy = p.y - dy * 0.08;
    const pull = Math.hypot(dx, dy);
    if (squishCooldown <= 0 && pull > 18) {
      Sound.playSquish(Math.min(1, pull / 80));
      squishCooldown = 0.07;
    }
  }

  function onDown(e) {
    e.preventDefault();
    Sound.unlock();
    if (pointerId !== null && e.pointerId !== pointerId) return;
    pointerId = e.pointerId;
    canvas.setPointerCapture(pointerId);
    const pos = pointerPos(e);
    pointer.x = pos.x;
    pointer.y = pos.y;
    dragIndex = nearestOuter(pos.x, pos.y);
    dragging = true;
    if (!hintFading) {
      hintFading = true;
      hint.classList.add('fade');
    }
  }

  function onMove(e) {
    if (!dragging || e.pointerId !== pointerId) return;
    e.preventDefault();
    const pos = pointerPos(e);
    pointer.x = pos.x;
    pointer.y = pos.y;
  }

  function onUp(e) {
    if (e.pointerId !== pointerId) return;
    e.preventDefault();
    dragging = false;
    dragIndex = -1;
    try { canvas.releasePointerCapture(pointerId); } catch (_) {}
    pointerId = null;
  }

  canvas.addEventListener('pointerdown', onDown, { passive: false });
  canvas.addEventListener('pointermove', onMove, { passive: false });
  canvas.addEventListener('pointerup', onUp, { passive: false });
  canvas.addEventListener('pointercancel', onUp, { passive: false });

  // ========== Win / reset ==========
  function triggerWin() {
    if (celebrating) return;
    celebrating = true;
    celebrateTimer = 1.5;
    fillHold = 0;
    shake = 10;
    Sound.playPop();
    Sound.playChime();
    try { if (navigator.vibrate) navigator.vibrate(50); } catch (_) {}
    const c = points[0];
    spawnConfetti(c.x, c.y, 60);
    burstEl.textContent = Math.random() > 0.5 ? 'POP!' : 'PURRFECT!';
    burstEl.classList.add('show');
    setTimeout(() => burstEl.classList.remove('show'), 900);
  }

  function advanceAfterWin() {
    celebrating = false;
    celebrateTimer = 0;
    setContainer(containerIndex + 1);
    buildCat(W * 0.5, H * 0.32, RADIUS());
    particles = [];
    shake = 0;
  }

  // ========== Render ==========
  function strokeSoftBodyPath() {
    const n = OUTER_N;
    const mid = (i) => {
      const a = points[1 + i];
      const b = points[1 + ((i + 1) % n)];
      return { x: (a.x + b.x) * 0.5, y: (a.y + b.y) * 0.5 };
    };
    const first = mid(0);
    ctx.moveTo(first.x, first.y);
    for (let i = 0; i < n; i++) {
      const control = points[1 + ((i + 1) % n)];
      const end = mid((i + 1) % n);
      ctx.quadraticCurveTo(control.x, control.y, end.x, end.y);
    }
    ctx.closePath();
  }

  function avgSpokeRest() {
    let sum = 0, count = 0;
    for (let i = 0; i < springs.length; i++) {
      if (springs[i].a === 0) { sum += springs[i].rest; count++; }
    }
    return count ? sum / count : RADIUS();
  }

  function stretchRatio() {
    const rest = avgSpokeRest();
    let max = 0;
    for (let i = 1; i <= OUTER_N; i++) {
      const d = vdist(points[0], points[i]) / rest;
      if (d > max) max = d;
    }
    return max;
  }

  function drawEars(c) {
    const tipScale = 0.52;
    function ear(baseL, baseR) {
      const mx = (baseL.x + baseR.x) * 0.5;
      const my = (baseL.y + baseR.y) * 0.5;
      let nx = -(baseR.y - baseL.y);
      let ny = baseR.x - baseL.x;
      const nl = Math.hypot(nx, ny) || 1;
      nx /= nl; ny /= nl;
      const toC = { x: mx - c.x, y: my - c.y };
      const sign = toC.x * nx + toC.y * ny < 0 ? -1 : 1;
      const tipX = mx + nx * sign * (avgSpokeRest() * tipScale);
      const tipY = my + ny * sign * (avgSpokeRest() * tipScale);
      ctx.beginPath();
      ctx.moveTo(baseL.x, baseL.y);
      ctx.lineTo(tipX, tipY);
      ctx.lineTo(baseR.x, baseR.y);
      ctx.closePath();
      ctx.fillStyle = COLORS.cat;
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(baseL.x * 0.65 + tipX * 0.35, baseL.y * 0.65 + tipY * 0.35);
      ctx.lineTo(tipX * 0.85 + mx * 0.15, tipY * 0.85 + my * 0.15);
      ctx.lineTo(baseR.x * 0.65 + tipX * 0.35, baseR.y * 0.65 + tipY * 0.35);
      ctx.closePath();
      ctx.fillStyle = 'rgba(255, 82, 119, 0.35)';
      ctx.fill();
    }
    ear(points[OUTER_N], points[1]);
    ear(points[1], points[2]);
  }

  function drawFace(c) {
    const lookTarget = dragging ? pointer : { x: c.x, y: c.y - 10 };
    let lx = lookTarget.x - c.x;
    let ly = lookTarget.y - c.y;
    const llen = Math.hypot(lx, ly) || 1;
    lx /= llen; ly /= llen;
    const lookAmt = 4.5;
    const squint = stretchRatio() > 1.45 || fillRatio() > 0.7;
    const eyeY = c.y - 6;
    const eyeSpread = 11;
    const eyeR = squint ? 2.2 : 3.6;
    const pupilR = squint ? 1.1 : 1.7;

    function eye(ex) {
      const ox = ex + lx * lookAmt;
      const oy = eyeY + ly * lookAmt * 0.35;
      ctx.beginPath();
      if (squint) ctx.ellipse(ox, oy, eyeR * 1.6, eyeR * 0.55, 0, 0, Math.PI * 2);
      else ctx.arc(ox, oy, eyeR, 0, Math.PI * 2);
      ctx.fillStyle = '#fff';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(ox + lx * 1.2, oy + ly * 1.2, pupilR, 0, Math.PI * 2);
      ctx.fillStyle = '#3a2a40';
      ctx.fill();
    }
    eye(c.x - eyeSpread);
    eye(c.x + eyeSpread);

    ctx.beginPath();
    ctx.moveTo(c.x, c.y + 2);
    ctx.lineTo(c.x - 3.5, c.y + 7);
    ctx.lineTo(c.x + 3.5, c.y + 7);
    ctx.closePath();
    ctx.fillStyle = COLORS.face;
    ctx.fill();

    ctx.beginPath();
    ctx.strokeStyle = COLORS.face;
    ctx.lineWidth = 1.6;
    ctx.lineCap = 'round';
    if (squint) ctx.arc(c.x, c.y + 12, 5, 0.15 * Math.PI, 0.85 * Math.PI);
    else {
      ctx.moveTo(c.x - 5, c.y + 11);
      ctx.quadraticCurveTo(c.x, c.y + 15, c.x + 5, c.y + 11);
    }
    ctx.stroke();
  }

  function drawContainer() {
    if (!container) return;
    const locked = fillRatio() >= 0.85;
    ctx.beginPath();
    const poly = container.path;
    ctx.moveTo(poly[0].x, poly[0].y);
    for (let i = 1; i < poly.length; i++) ctx.lineTo(poly[i].x, poly[i].y);
    ctx.closePath();
    ctx.fillStyle = COLORS.glassFill;
    ctx.fill();

    ctx.beginPath();
    for (let s = 0; s < container.segments.length; s++) {
      const seg = container.segments[s];
      ctx.moveTo(seg.ax, seg.ay);
      ctx.lineTo(seg.bx, seg.by);
    }
    ctx.strokeStyle = locked ? COLORS.lock : COLORS.glass;
    ctx.lineWidth = 5;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    if (locked) {
      ctx.shadowColor = COLORS.lock;
      ctx.shadowBlur = 15;
    }
    ctx.stroke();
    ctx.shadowBlur = 0;
  }

  function draw() {
    const ox = shake > 0 ? (Math.random() - 0.5) * shake : 0;
    const oy = shake > 0 ? (Math.random() - 0.5) * shake : 0;
    ctx.save();
    ctx.translate(ox, oy);

    ctx.clearRect(-20, -20, W + 40, H + 40);
    ctx.fillStyle = COLORS.bg;
    ctx.fillRect(-20, -20, W + 40, H + 40);

    drawContainer();

    const c = points[0];
    drawEars(c);

    ctx.beginPath();
    strokeSoftBodyPath();
    const grad = ctx.createRadialGradient(c.x - 18, c.y - 22, 8, c.x, c.y, avgSpokeRest() * 1.2);
    grad.addColorStop(0, '#FFB4B4');
    grad.addColorStop(0.55, COLORS.cat);
    grad.addColorStop(1, COLORS.catDeep);
    ctx.fillStyle = grad;
    ctx.fill();

    ctx.beginPath();
    ctx.ellipse(c.x - 16, c.y - 20, 18, 12, -0.4, 0, Math.PI * 2);
    ctx.fillStyle = COLORS.highlight;
    ctx.fill();

    ctx.beginPath();
    strokeSoftBodyPath();
    ctx.strokeStyle = 'rgba(255, 82, 119, 0.22)';
    ctx.lineWidth = 2;
    ctx.stroke();

    drawFace(c);
    drawParticles();
    ctx.restore();
  }

  function frame(t) {
    if (!lastTime) lastTime = t;
    let dt = (t - lastTime) / 1000;
    lastTime = t;
    dt = Math.min(dt, 0.033);
    const dtScale = dt / (1 / 60);

    if (thudCooldown > 0) thudCooldown -= dt;
    if (squishCooldown > 0) squishCooldown -= dt;
    if (shake > 0) shake = Math.max(0, shake - dt * 28);

    if (!celebrating) {
      const steps = 2;
      for (let i = 0; i < steps; i++) {
        verletIntegrate(dtScale / steps);
        applyDrag();
        satisfyConstraints();
      }
      const ratio = fillRatio();
      if (ratio >= 0.85) {
        fillHold += dt;
        if (fillHold >= 0.8) triggerWin();
      } else {
        fillHold = Math.max(0, fillHold - dt * 1.5);
      }
    } else {
      celebrateTimer -= dt;
      // keep soft jiggle while celebrating
      verletIntegrate(dtScale * 0.3);
      satisfyConstraints();
      if (celebrateTimer <= 0) advanceAfterWin();
    }

    updateParticles(dt);
    draw();
    requestAnimationFrame(frame);
  }

  function init() {
    resize();
    setContainer(0);
    buildCat(W * 0.5, H * 0.30, RADIUS());
    lastTime = 0;
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', () => {
    resize();
    setContainer(containerIndex);
    buildCat(W * 0.5, H * 0.30, RADIUS());
  });

  window.__liquidCat = {
    version: 'step3',
    getPointCount: () => points.length,
    getOuterCount: () => OUTER_N,
    getCenter: () => ({ x: points[0].x, y: points[0].y }),
    isDragging: () => dragging,
    getDragIndex: () => dragIndex,
    getFillRatio: () => fillRatio(),
    getFillHold: () => fillHold,
    getContainerId: () => (container ? container.id : null),
    getContainerIndex: () => containerIndex,
    isCelebrating: () => celebrating,
    getParticleCount: () => particles.length,
    getMouth: () => container ? {
      x: container.mouthX,
      y: container.mouthY,
      w: container.mouthW,
      neckY: container.neckY,
    } : null,
    /** Test helper: pack cat into vessel to validate win loop */
    debugPackIntoContainer: () => {
      if (!container) return;
      const cx = container.cx;
      const cy = (container.neckY + H * 0.88) * 0.5;
      const r = Math.min(container.mouthW * 0.28, (H * 0.88 - container.neckY) * 0.28);
      buildCat(cx, cy, r);
      for (let k = 0; k < 30; k++) satisfyConstraints();
    },
    debugTriggerWin: () => triggerWin(),
  };

  init();
})();
  </script>
</body>
</html>
