<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Liquid Cat — Riffle Demo</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #F4F0FF;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: grab;
    }
    canvas:active { cursor: grabbing; }
    #hint {
      position: fixed;
      left: 50%;
      top: 12%;
      transform: translateX(-50%);
      color: rgba(80, 60, 100, 0.55);
      font-size: 14px;
      letter-spacing: 0.02em;
      pointer-events: none;
      opacity: 1;
      transition: opacity 0.8s ease;
      white-space: nowrap;
      z-index: 2;
    }
    #hint.fade { opacity: 0; }
  </style>
</head>
<body>
  <div id="hint">Squish the cat!</div>
  <canvas id="c"></canvas>
  <script>
(function () {
  'use strict';

  // ===== Step 1: Canvas + Verlet soft body + nearest-point drag =====
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const hint = document.getElementById('hint');

  const COLORS = {
    bg: '#F4F0FF',
    cat: '#FF9E9E',
    catDeep: '#FF8585',
    point: 'rgba(255, 82, 119, 0.35)',
    spring: 'rgba(255, 82, 119, 0.18)',
  };

  let W = 0, H = 0, dpr = 1;
  let lastTime = 0;
  let hintFading = false;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  // ----- Vector helpers -----
  function vsub(a, b) { return { x: a.x - b.x, y: a.y - b.y }; }
  function vlen(v) { return Math.hypot(v.x, v.y); }
  function vdist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

  // ----- Soft body -----
  const OUTER_N = 16;
  const CONSTRAINT_ITERS = 4;
  const DAMPING = 0.985;
  const GRAVITY = 0.18;
  const RADIUS = () => Math.min(W, H) * 0.16;

  /** @type {{x:number,y:number,ox:number,oy:number,pinned:boolean}[]} */
  let points = [];
  /** @type {{a:number,b:number,rest:number,stiffness:number}[]} */
  let springs = [];
  let centerIndex = 0;

  function makePoint(x, y) {
    return { x, y, ox: x, oy: y, pinned: false };
  }

  function buildCat(cx, cy, r) {
    points = [];
    springs = [];
    points.push(makePoint(cx, cy)); // center
    centerIndex = 0;
    for (let i = 0; i < OUTER_N; i++) {
      const a = (i / OUTER_N) * Math.PI * 2 - Math.PI / 2;
      points.push(makePoint(cx + Math.cos(a) * r, cy + Math.sin(a) * r));
    }
    // ring springs
    for (let i = 0; i < OUTER_N; i++) {
      const a = 1 + i;
      const b = 1 + ((i + 1) % OUTER_N);
      springs.push({ a, b, rest: vdist(points[a], points[b]), stiffness: 0.55 });
      // spoke to center
      springs.push({ a: 0, b: a, rest: r, stiffness: 0.35 });
      // skip-one ring for volume
      const c = 1 + ((i + 2) % OUTER_N);
      springs.push({ a, b: c, rest: vdist(points[a], points[c]), stiffness: 0.22 });
    }
  }

  function verletIntegrate(dtScale) {
    const g = GRAVITY * dtScale * dtScale;
    for (let i = 0; i < points.length; i++) {
      const p = points[i];
      if (p.pinned) continue;
      const vx = (p.x - p.ox) * DAMPING;
      const vy = (p.y - p.oy) * DAMPING;
      p.ox = p.x;
      p.oy = p.y;
      p.x += vx;
      p.y += vy + g;
    }
  }

  function satisfyConstraints() {
    for (let iter = 0; iter < CONSTRAINT_ITERS; iter++) {
      for (let s = 0; s < springs.length; s++) {
        const sp = springs[s];
        const pa = points[sp.a];
        const pb = points[sp.b];
        let dx = pb.x - pa.x;
        let dy = pb.y - pa.y;
        const dist = Math.hypot(dx, dy) || 0.0001;
        const diff = (dist - sp.rest) / dist;
        const k = sp.stiffness * 0.5;
        const ox = dx * diff * k;
        const oy = dy * diff * k;
        if (!pa.pinned) { pa.x += ox; pa.y += oy; }
        if (!pb.pinned) { pb.x -= ox; pb.y -= oy; }
      }
      // soft floor / wall keep-in so it doesn't fly away during step1
      const pad = 8;
      for (let i = 0; i < points.length; i++) {
        const p = points[i];
        if (p.pinned) continue;
        if (p.x < pad) p.x = pad;
        if (p.x > W - pad) p.x = W - pad;
        if (p.y < pad) p.y = pad;
        if (p.y > H - pad) {
          p.y = H - pad;
          p.oy = p.y; // kill downward velocity on floor
        }
      }
    }
  }

  // ----- Drag (nearest outer point + spring pull) -----
  let dragging = false;
  let dragIndex = -1;
  let pointerId = null;
  const pointer = { x: 0, y: 0 };
  const DRAG_STIFFNESS = 0.45;

  function pointerPos(e) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: e.clientX - rect.left,
      y: e.clientY - rect.top,
    };
  }

  function nearestOuter(x, y) {
    let best = 1;
    let bestD = Infinity;
    for (let i = 1; i <= OUTER_N; i++) {
      const d = vdist(points[i], { x, y });
      if (d < bestD) { bestD = d; best = i; }
    }
    // only grab if reasonably close (or anywhere for playability in step1)
    return best;
  }

  function applyDrag() {
    if (!dragging || dragIndex < 0) return;
    const p = points[dragIndex];
    const dx = pointer.x - p.x;
    const dy = pointer.y - p.y;
    p.x += dx * DRAG_STIFFNESS;
    p.y += dy * DRAG_STIFFNESS;
    // lightly damp old position so it doesn't slingshot
    p.ox = p.x - dx * 0.08;
    p.oy = p.y - dy * 0.08;
  }

  function onDown(e) {
    e.preventDefault();
    if (pointerId !== null && e.pointerId !== pointerId) return;
    pointerId = e.pointerId;
    canvas.setPointerCapture(pointerId);
    const pos = pointerPos(e);
    pointer.x = pos.x;
    pointer.y = pos.y;
    dragIndex = nearestOuter(pos.x, pos.y);
    dragging = true;
    if (!hintFading) {
      hintFading = true;
      hint.classList.add('fade');
    }
  }

  function onMove(e) {
    if (!dragging || e.pointerId !== pointerId) return;
    e.preventDefault();
    const pos = pointerPos(e);
    pointer.x = pos.x;
    pointer.y = pos.y;
  }

  function onUp(e) {
    if (e.pointerId !== pointerId) return;
    e.preventDefault();
    dragging = false;
    dragIndex = -1;
    try { canvas.releasePointerCapture(pointerId); } catch (_) {}
    pointerId = null;
  }

  canvas.addEventListener('pointerdown', onDown, { passive: false });
  canvas.addEventListener('pointermove', onMove, { passive: false });
  canvas.addEventListener('pointerup', onUp, { passive: false });
  canvas.addEventListener('pointercancel', onUp, { passive: false });

  // ----- Render (polygon preview for step1) -----
  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = COLORS.bg;
    ctx.fillRect(0, 0, W, H);

    // springs (debug-lite)
    ctx.strokeStyle = COLORS.spring;
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let s = 0; s < springs.length; s++) {
      const sp = springs[s];
      const a = points[sp.a];
      const b = points[sp.b];
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
    }
    ctx.stroke();

    // body fill
    ctx.beginPath();
    for (let i = 0; i < OUTER_N; i++) {
      const p = points[1 + i];
      if (i === 0) ctx.moveTo(p.x, p.y);
      else ctx.lineTo(p.x, p.y);
    }
    ctx.closePath();
    const c = points[0];
    const grad = ctx.createRadialGradient(c.x - 18, c.y - 22, 8, c.x, c.y, RADIUS() * 1.15);
    grad.addColorStop(0, '#FFB4B4');
    grad.addColorStop(0.55, COLORS.cat);
    grad.addColorStop(1, COLORS.catDeep);
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.strokeStyle = 'rgba(255, 82, 119, 0.25)';
    ctx.lineWidth = 2;
    ctx.stroke();

    // outer points
    for (let i = 1; i <= OUTER_N; i++) {
      const p = points[i];
      ctx.beginPath();
      ctx.arc(p.x, p.y, i === dragIndex ? 5.5 : 3.2, 0, Math.PI * 2);
      ctx.fillStyle = i === dragIndex ? '#FF5277' : COLORS.point;
      ctx.fill();
    }
  }

  function frame(t) {
    if (!lastTime) lastTime = t;
    let dt = (t - lastTime) / 1000;
    lastTime = t;
    dt = Math.min(dt, 0.033);
    const dtScale = dt / (1 / 60);

    // fixed-ish substeps
    const steps = 2;
    for (let i = 0; i < steps; i++) {
      verletIntegrate(dtScale / steps);
      applyDrag();
      satisfyConstraints();
    }

    draw();
    requestAnimationFrame(frame);
  }

  function init() {
    resize();
    buildCat(W * 0.5, H * 0.38, RADIUS());
    lastTime = 0;
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', () => {
    const cx = points[0] ? points[0].x / (W || 1) : 0.5;
    const cy = points[0] ? points[0].y / (H || 1) : 0.38;
    resize();
    // rebuild rests proportionally by keeping positions, update rest lengths
    const r = RADIUS();
    for (let i = 0; i < springs.length; i++) {
      const sp = springs[i];
      // keep current rest relative — simpler: rebuild around current center
    }
    buildCat(
      Math.min(Math.max(cx * W, 40), W - 40),
      Math.min(Math.max(cy * H, 40), H - 40),
      r
    );
  });

  // expose for Playwright / debug
  window.__liquidCat = {
    version: 'step1',
    getPointCount: () => points.length,
    getOuterCount: () => OUTER_N,
    getCenter: () => ({ x: points[0].x, y: points[0].y }),
    isDragging: () => dragging,
    getDragIndex: () => dragIndex,
    getBounds: () => {
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      for (let i = 0; i < points.length; i++) {
        const p = points[i];
        if (p.x < minX) minX = p.x;
        if (p.y < minY) minY = p.y;
        if (p.x > maxX) maxX = p.x;
        if (p.y > maxY) maxY = p.y;
      }
      return { minX, minY, maxX, maxY };
    },
  };

  init();
})();
  </script>
</body>
</html>
