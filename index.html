<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Liquid Cat — Riffle Demo</title>
  <style>
    :root {
      --bg0: #efe8ff;
      --bg1: #f7f2ff;
      --ink: #5a4570;
      --accent: #ff5277;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(120% 80% at 50% 0%, #fff7ff 0%, transparent 55%),
        radial-gradient(90% 70% at 20% 90%, rgba(112, 214, 188, 0.22) 0%, transparent 50%),
        radial-gradient(80% 60% at 90% 20%, rgba(255, 158, 158, 0.2) 0%, transparent 45%),
        linear-gradient(180deg, var(--bg1) 0%, var(--bg0) 100%);
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      font-family: "Trebuchet MS", "Segoe UI", Candara, sans-serif;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: grab;
    }
    canvas:active { cursor: grabbing; }
    #hint {
      position: fixed;
      left: 50%;
      top: max(6.5%, env(safe-area-inset-top, 0px) + 22px);
      transform: translateX(-50%);
      color: rgba(90, 69, 112, 0.78);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: clamp(14px, 3.8vw, 17px);
      font-weight: 600;
      letter-spacing: 0.01em;
      pointer-events: none;
      opacity: 1;
      transition: opacity 0.75s ease, transform 0.75s ease;
      white-space: nowrap;
      z-index: 2;
      text-shadow: 0 1px 0 rgba(255,255,255,0.7);
      animation: hintFloat 2.8s ease-in-out infinite;
    }
    #hint.fade {
      opacity: 0;
      transform: translateX(-50%) translateY(-8px);
      animation: none;
    }
    #fillHud {
      position: fixed;
      left: 50%;
      bottom: max(3.5%, env(safe-area-inset-bottom, 0px) + 14px);
      transform: translateX(-50%);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: rgba(90, 69, 112, 0.45);
      pointer-events: none;
      z-index: 2;
      text-shadow: 0 1px 0 rgba(255,255,255,0.55);
    }
    @keyframes hintFloat {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(-4px); }
    }
    #burst {
      position: fixed;
      left: 50%;
      top: 40%;
      transform: translate(-50%, -50%) scale(0.55) rotate(-4deg);
      color: var(--accent);
      font-size: clamp(36px, 10vw, 52px);
      font-weight: 800;
      letter-spacing: 0.06em;
      pointer-events: none;
      opacity: 0;
      z-index: 3;
      text-shadow:
        0 6px 24px rgba(255, 82, 119, 0.35),
        0 2px 0 rgba(255,255,255,0.5);
      transition: opacity 0.18s ease, transform 0.35s cubic-bezier(0.18, 1.45, 0.3, 1);
    }
    #burst.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1) rotate(0deg);
    }
  </style>
</head>
<body>
  <div id="hint">Squish the cat into the vase! 🐾</div>
  <div id="burst">POP!</div>
  <div id="fillHud">0% Full</div>
  <canvas id="c"></canvas>
  <script>
(function () {
  'use strict';

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const hint = document.getElementById('hint');
  const burstEl = document.getElementById('burst');
  const fillHud = document.getElementById('fillHud');

  const COLORS = {
    bgTop: '#F7F2FF',
    bgBot: '#EFE8FF',
    cat: '#FF9E9E',
    catMid: '#FF8F98',
    catDeep: '#FF7A8A',
    face: '#FF5277',
    cheek: 'rgba(255, 140, 170, 0.5)',
    innerEar: 'rgba(255, 180, 195, 0.95)',
    pawPad: 'rgba(255, 255, 255, 0.72)',
    highlight: 'rgba(255,255,255,0.55)',
    glass: 'rgba(112, 214, 188, 0.8)',
    glassRim: 'rgba(255,255,255,0.72)',
    glassFrost: 'rgba(255, 255, 255, 0.35)',
    glassFillTop: 'rgba(255, 255, 255, 0.28)',
    glassFillBot: 'rgba(160, 235, 215, 0.12)',
    lock: '#38EF7D',
    ink: '#2B2033',
    confetti: ['#FFD166', '#06D6A0', '#7BDFF2', '#EF476F', '#FF9E9E', '#CDB4FF'],
  };

  let W = 0, H = 0, dpr = 1;
  let lastTime = 0;
  let hintFading = false;
  let shake = 0;
  let celebrating = false;
  let celebrateTimer = 0;
  let fillHold = 0;
  let containerIndex = 0;
  let targetArea = 1;
  let timeSec = 0;

  // Container transition: play → celebrate → exit → enter → play
  let phase = 'play';
  let transT = 0;
  let transDur = 0.55;
  let containerSlide = 0; // px offset for glass draw/collision
  let pendingContainerIndex = 0;

  // Face animation
  let blinkT = 0;
  let nextBlink = 2.2 + Math.random() * 1.8;
  let blinkAmount = 0; // 0 open → 1 closed

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function vdist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
  function easeInOutCubic(t) {
    return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  }

  // ========== SoundEngine ==========
  const Sound = (function () {
    let ctxAudio = null;
    let unlocked = false;

    function ensure() {
      if (!ctxAudio) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        ctxAudio = new AC();
      }
      return ctxAudio;
    }

    async function unlock() {
      const a = ensure();
      if (!a) return;
      if (a.state === 'suspended') {
        try { await a.resume(); } catch (_) {}
      }
      unlocked = a.state === 'running';
    }

    function envGain(a, peak, attack, release) {
      const g = a.createGain();
      const t = a.currentTime;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(Math.max(0.0001, peak), t + attack);
      g.gain.exponentialRampToValueAtTime(0.0001, t + attack + release);
      return g;
    }

    function playSquish(intensity) {
      const a = ensure();
      if (!a || !unlocked) return;
      const osc = a.createOscillator();
      const filter = a.createBiquadFilter();
      const g = envGain(a, 0.11 * Math.min(1, intensity), 0.01, 0.09);
      osc.type = 'sine';
      const t = a.currentTime;
      osc.frequency.setValueAtTime(150, t);
      osc.frequency.exponentialRampToValueAtTime(55, t + 0.06);
      filter.type = 'lowpass';
      filter.frequency.value = 380;
      osc.connect(filter);
      filter.connect(g);
      g.connect(a.destination);
      osc.start(t);
      osc.stop(t + 0.12);
    }

    function playThud() {
      const a = ensure();
      if (!a || !unlocked) return;
      const osc = a.createOscillator();
      const g = envGain(a, 0.24, 0.005, 0.05);
      osc.type = 'triangle';
      const t = a.currentTime;
      osc.frequency.setValueAtTime(90, t);
      osc.frequency.exponentialRampToValueAtTime(30, t + 0.04);
      osc.connect(g);
      g.connect(a.destination);
      osc.start(t);
      osc.stop(t + 0.08);
    }

    function playPop() {
      const a = ensure();
      if (!a || !unlocked) return;
      const osc = a.createOscillator();
      const g = envGain(a, 0.35, 0.005, 0.08);
      osc.type = 'sine';
      const t = a.currentTime;
      osc.frequency.setValueAtTime(180, t);
      osc.frequency.exponentialRampToValueAtTime(850, t + 0.02);
      osc.frequency.exponentialRampToValueAtTime(200, t + 0.07);
      osc.connect(g);
      g.connect(a.destination);
      osc.start(t);
      osc.stop(t + 0.1);
    }

    function playChime() {
      const a = ensure();
      if (!a || !unlocked) return;
      const t = a.currentTime;
      [1046.5, 1318.5, 1567.9].forEach((f, i) => {
        const osc = a.createOscillator();
        const g = envGain(a, 0.14, 0.01, 0.55);
        osc.type = 'sine';
        osc.frequency.value = f;
        osc.connect(g);
        g.connect(a.destination);
        osc.start(t + i * 0.03);
        osc.stop(t + 0.75);
      });
    }

    function playWhoosh() {
      const a = ensure();
      if (!a || !unlocked) return;
      const osc = a.createOscillator();
      const g = envGain(a, 0.06, 0.02, 0.22);
      const filter = a.createBiquadFilter();
      osc.type = 'triangle';
      const t = a.currentTime;
      osc.frequency.setValueAtTime(220, t);
      osc.frequency.exponentialRampToValueAtTime(90, t + 0.25);
      filter.type = 'bandpass';
      filter.frequency.value = 400;
      osc.connect(filter);
      filter.connect(g);
      g.connect(a.destination);
      osc.start(t);
      osc.stop(t + 0.3);
    }

    return { unlock, playSquish, playThud, playPop, playChime, playWhoosh, isUnlocked: () => unlocked };
  })();

  // ========== Particles ==========
  /** @type {{x:number,y:number,vx:number,vy:number,life:number,color:string,size:number,rot:number,vr:number}[]} */
  let particles = [];

  function spawnConfetti(x, y, n) {
    for (let i = 0; i < n; i++) {
      const ang = Math.random() * Math.PI * 2;
      const spd = 3.5 + Math.random() * 8;
      particles.push({
        x, y,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd - 5,
        life: 1.0 + Math.random() * 0.7,
        color: COLORS.confetti[(Math.random() * COLORS.confetti.length) | 0],
        size: 3 + Math.random() * 5,
        rot: Math.random() * Math.PI,
        vr: (Math.random() - 0.5) * 0.45,
      });
    }
  }

  function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life -= dt;
      p.vy += 18 * dt;
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vr;
      p.vx *= 0.99;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }

  function drawParticles() {
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life));
      ctx.fillStyle = p.color;
      if (i % 3 === 0) {
        ctx.beginPath();
        ctx.moveTo(0, -p.size * 0.55);
        ctx.lineTo(p.size * 0.45, p.size * 0.4);
        ctx.lineTo(-p.size * 0.45, p.size * 0.4);
        ctx.closePath();
        ctx.fill();
      } else if (i % 2 === 0) {
        ctx.fillRect(-p.size * 0.5, -p.size * 0.28, p.size, p.size * 0.56);
      } else {
        ctx.beginPath();
        ctx.arc(0, 0, p.size * 0.42, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  // ========== Soft body ==========
  const OUTER_N = 16;
  const CONSTRAINT_ITERS = 5;
  const DAMPING = 0.984;
  const GRAVITY = 0.155;
  // ~1.3× previous radius so the gummy cat dominates the viewport
  const RADIUS = () => Math.min(W, H) * 0.192;

  /** @type {{x:number,y:number,ox:number,oy:number,pinned:boolean}[]} */
  let points = [];
  /** @type {{a:number,b:number,rest:number,stiffness:number}[]} */
  let springs = [];

  function makePoint(x, y) {
    return { x, y, ox: x, oy: y, pinned: false };
  }

  function buildCat(cx, cy, r) {
    points = [];
    springs = [];
    points.push(makePoint(cx, cy));
    for (let i = 0; i < OUTER_N; i++) {
      const a = (i / OUTER_N) * Math.PI * 2 - Math.PI / 2;
      points.push(makePoint(cx + Math.cos(a) * r, cy + Math.sin(a) * r));
    }
    for (let i = 0; i < OUTER_N; i++) {
      const a = 1 + i;
      const b = 1 + ((i + 1) % OUTER_N);
      springs.push({ a, b, rest: vdist(points[a], points[b]), stiffness: 0.56 });
      springs.push({ a: 0, b: a, rest: r, stiffness: 0.36 });
      const c = 1 + ((i + 2) % OUTER_N);
      springs.push({ a, b: c, rest: vdist(points[a], points[c]), stiffness: 0.22 });
    }
    targetArea = shoelaceArea();
  }

  function shoelaceArea() {
    let area = 0;
    for (let i = 0; i < OUTER_N; i++) {
      const p = points[1 + i];
      const q = points[1 + ((i + 1) % OUTER_N)];
      area += p.x * q.y - q.x * p.y;
    }
    return Math.abs(area) * 0.5;
  }

  function applyAreaPressure() {
    const area = shoelaceArea();
    if (targetArea <= 0) return;
    const deficit = (targetArea - area) / targetArea;
    if (deficit <= 0.02) return;
    const pressure = Math.min(0.52, deficit * 0.82);
    const c = points[0];
    for (let i = 1; i <= OUTER_N; i++) {
      const p = points[i];
      let nx = p.x - c.x;
      let ny = p.y - c.y;
      const len = Math.hypot(nx, ny) || 1;
      nx /= len; ny /= len;
      p.x += nx * pressure * 2.15;
      p.y += ny * pressure * 2.15;
    }
  }

  function verletIntegrate(dtScale) {
    const g = GRAVITY * dtScale * dtScale;
    for (let i = 0; i < points.length; i++) {
      const p = points[i];
      if (p.pinned) continue;
      const vx = (p.x - p.ox) * DAMPING;
      const vy = (p.y - p.oy) * DAMPING;
      p.ox = p.x;
      p.oy = p.y;
      p.x += vx;
      p.y += vy + g;
    }
  }

  // ========== Containers ==========
  /** @type {{id:string, segments:{ax:number,ay:number,bx:number,by:number}[], neckY:number, path:{x:number,y:number}[], cx:number, mouthX:number, mouthY:number, mouthW:number, stem?:{x:number,y:number}[]}} */
  let container = null;

  function offsetSeg(seg, ox) {
    return { ax: seg.ax + ox, ay: seg.ay, bx: seg.bx + ox, by: seg.by };
  }

  function buildGoblet() {
    const cx = W * 0.5;
    const baseY = H * 0.90;
    const topY = H * 0.44;
    const neckY = H * 0.56;
    const bowlY = H * 0.72;
    const footY = H * 0.845;
    const rimW = Math.min(W, H) * 0.195;
    const neckW = Math.min(W, H) * 0.088;
    const bowlW = Math.min(W, H) * 0.235;
    const footW = Math.min(W, H) * 0.12;
    const bottomW = Math.min(W, H) * 0.195;

    const L = [
      { x: cx - rimW, y: topY },
      { x: cx - neckW, y: neckY },
      { x: cx - bowlW, y: bowlY },
      { x: cx - footW, y: footY },
      { x: cx - bottomW, y: baseY },
    ];
    const R = [
      { x: cx + bottomW, y: baseY },
      { x: cx + footW, y: footY },
      { x: cx + bowlW, y: bowlY },
      { x: cx + neckW, y: neckY },
      { x: cx + rimW, y: topY },
    ];
    const path = L.concat(R);
    const segments = [];
    for (let i = 0; i < L.length - 1; i++) {
      segments.push({ ax: L[i].x, ay: L[i].y, bx: L[i + 1].x, by: L[i + 1].y });
    }
    segments.push({ ax: L[L.length - 1].x, ay: L[L.length - 1].y, bx: R[0].x, by: R[0].y });
    for (let i = 0; i < R.length - 1; i++) {
      segments.push({ ax: R[i].x, ay: R[i].y, bx: R[i + 1].x, by: R[i + 1].y });
    }
    return {
      id: 'goblet',
      segments,
      neckY,
      path,
      cx,
      mouthX: cx,
      mouthY: topY,
      mouthW: rimW * 2,
    };
  }

  function buildBeaker() {
    const cx = W * 0.5;
    const topY = H * 0.45;
    const baseY = H * 0.885;
    const half = Math.min(W, H) * 0.228;
    const lip = Math.min(W, H) * 0.016;
    const path = [
      { x: cx - half - lip, y: topY },
      { x: cx - half, y: topY + lip * 1.4 },
      { x: cx - half, y: baseY },
      { x: cx + half, y: baseY },
      { x: cx + half, y: topY + lip * 1.4 },
      { x: cx + half + lip, y: topY },
    ];
    const segments = [
      { ax: cx - half, ay: topY + lip * 1.4, bx: cx - half, by: baseY },
      { ax: cx - half, ay: baseY, bx: cx + half, by: baseY },
      { ax: cx + half, ay: baseY, bx: cx + half, by: topY + lip * 1.4 },
    ];
    return {
      id: 'beaker',
      segments,
      neckY: topY + (baseY - topY) * 0.10,
      path,
      cx,
      mouthX: cx,
      mouthY: topY,
      mouthW: half * 2,
    };
  }

  const builders = [buildGoblet, buildBeaker];

  function setContainer(index) {
    containerIndex = ((index % builders.length) + builders.length) % builders.length;
    container = builders[containerIndex]();
  }

  let thudCooldown = 0;

  function vesselBoundsAtY(y, ox) {
    let left = -Infinity;
    let right = Infinity;
    let bottom = -Infinity;
    const cx = container.cx + ox;
    for (let s = 0; s < container.segments.length; s++) {
      const seg = offsetSeg(container.segments[s], ox);
      const ax = seg.ax, ay = seg.ay, bx = seg.bx, by = seg.by;
      if (Math.abs(ay - by) < 0.5) {
        bottom = Math.max(bottom, ay);
        continue;
      }
      const minY = Math.min(ay, by);
      const maxY = Math.max(ay, by);
      if (y < minY - 0.5 || y > maxY + 0.5) continue;
      const t = (y - ay) / ((by - ay) || 1e-6);
      const x = ax + (bx - ax) * t;
      if (x < cx) left = Math.max(left, x);
      else right = Math.min(right, x);
    }
    if (left === -Infinity) left = cx - container.mouthW * 0.5;
    if (right === Infinity) right = cx + container.mouthW * 0.5;
    if (bottom === -Infinity) bottom = H * 0.92;
    return { left, right, bottom };
  }

  function collideContainer() {
    if (!container || phase === 'exit' || phase === 'enter') return;
    const inset = 3;
    const ox = containerSlide;
    const mouthHalf = container.mouthW * 0.55;
    const cx = container.cx + ox;
    for (let i = 0; i < points.length; i++) {
      const p = points[i];
      if (p.y < container.mouthY) continue;

      const inMouthLane = Math.abs(p.x - cx) <= mouthHalf;
      const inside = pointInVessel(p.x - ox, p.y);
      if (!inside && !inMouthLane) continue;

      const prevX = p.x;
      const prevY = p.y;
      const b = vesselBoundsAtY(p.y, ox);
      let hitWall = false;

      if (p.x < b.left + inset) {
        p.x = b.left + inset;
        hitWall = true;
      } else if (p.x > b.right - inset) {
        p.x = b.right - inset;
        hitWall = true;
      }
      if (p.y > b.bottom - inset) {
        p.y = b.bottom - inset;
        hitWall = true;
      }

      if (hitWall) {
        const speed = Math.hypot(prevX - p.ox, prevY - p.oy);
        p.ox = p.x - (p.x - p.ox) * 0.55;
        p.oy = p.y - (p.y - p.oy) * 0.55;
        if (thudCooldown <= 0 && speed > 2.8) {
          Sound.playThud();
          thudCooldown = 0.12;
        }
      }
    }
  }

  function pointInVessel(x, y) {
    if (!container) return false;
    if (y < container.mouthY) return false;
    const poly = container.path;
    let inside = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; i++) {
      const xi = poly[i].x, yi = poly[i].y;
      const xj = poly[j].x, yj = poly[j].y;
      const intersect = ((yi > y) !== (yj > y)) &&
        (x < (xj - xi) * (y - yi) / ((yj - yi) || 1e-6) + xi);
      if (intersect) inside = !inside;
      j = i;
    }
    return inside;
  }

  function satisfyConstraints() {
    for (let iter = 0; iter < CONSTRAINT_ITERS; iter++) {
      for (let s = 0; s < springs.length; s++) {
        const sp = springs[s];
        const pa = points[sp.a];
        const pb = points[sp.b];
        const dx = pb.x - pa.x;
        const dy = pb.y - pa.y;
        const dist = Math.hypot(dx, dy) || 0.0001;
        const diff = (dist - sp.rest) / dist;
        const k = sp.stiffness * 0.5;
        const ox = dx * diff * k;
        const oy = dy * diff * k;
        if (!pa.pinned) { pa.x += ox; pa.y += oy; }
        if (!pb.pinned) { pb.x -= ox; pb.y -= oy; }
      }
      applyAreaPressure();
      collideContainer();

      const pad = 6;
      for (let i = 0; i < points.length; i++) {
        const p = points[i];
        if (p.pinned) continue;
        if (p.x < pad) p.x = pad;
        if (p.x > W - pad) p.x = W - pad;
        if (p.y < pad) p.y = pad;
        if (p.y > H - pad) {
          p.y = H - pad;
          p.oy = p.y;
        }
      }
    }
  }

  function fillRatio() {
    if (!container) return 0;
    if (phase === 'exit' || phase === 'enter') return 0;
    let inside = 0;
    const ox = containerSlide;
    // Count mass that has entered the vessel mouth (not only below the neck).
    // Still biased toward "mostly stuffed" via 0.85 threshold + hold time.
    for (let i = 1; i <= OUTER_N; i++) {
      const p = points[i];
      if (p.y >= container.mouthY - 2 && pointInVessel(p.x - ox, Math.max(p.y, container.mouthY + 1))) {
        inside++;
      } else if (p.y >= container.neckY && Math.abs(p.x - (container.cx + ox)) < container.mouthW * 0.55) {
        // points jammed in the neck lane still count toward fill progress
        inside += 0.65;
      }
    }
    return Math.min(1, inside / OUTER_N);
  }

  // ========== Drag ==========
  let dragging = false;
  let dragIndex = -1;
  let pointerId = null;
  const pointer = { x: 0, y: 0 };
  const DRAG_STIFFNESS = 0.48;
  let squishCooldown = 0;

  function pointerPos(e) {
    const rect = canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }

  function nearestOuter(x, y) {
    let best = 1;
    let bestD = Infinity;
    for (let i = 1; i <= OUTER_N; i++) {
      const d = vdist(points[i], { x, y });
      if (d < bestD) { bestD = d; best = i; }
    }
    return best;
  }

  function applyDrag() {
    if (!dragging || dragIndex < 0 || celebrating || phase !== 'play') return;
    const p = points[dragIndex];
    const dx = pointer.x - p.x;
    const dy = pointer.y - p.y;
    p.x += dx * DRAG_STIFFNESS;
    p.y += dy * DRAG_STIFFNESS;
    p.ox = p.x - dx * 0.08;
    p.oy = p.y - dy * 0.08;
    const pull = Math.hypot(dx, dy);
    if (squishCooldown <= 0 && pull > 18) {
      Sound.playSquish(Math.min(1, pull / 80));
      squishCooldown = 0.07;
    }
  }

  function onDown(e) {
    e.preventDefault();
    Sound.unlock();
    if (pointerId !== null && e.pointerId !== pointerId) return;
    if (phase !== 'play') return;
    pointerId = e.pointerId;
    canvas.setPointerCapture(pointerId);
    const pos = pointerPos(e);
    pointer.x = pos.x;
    pointer.y = pos.y;
    dragIndex = nearestOuter(pos.x, pos.y);
    dragging = true;
    if (!hintFading) {
      hintFading = true;
      hint.classList.add('fade');
    }
  }

  function onMove(e) {
    if (!dragging || e.pointerId !== pointerId) return;
    e.preventDefault();
    const pos = pointerPos(e);
    pointer.x = pos.x;
    pointer.y = pos.y;
  }

  function onUp(e) {
    if (e.pointerId !== pointerId) return;
    e.preventDefault();
    dragging = false;
    dragIndex = -1;
    try { canvas.releasePointerCapture(pointerId); } catch (_) {}
    pointerId = null;
  }

  canvas.addEventListener('pointerdown', onDown, { passive: false });
  canvas.addEventListener('pointermove', onMove, { passive: false });
  canvas.addEventListener('pointerup', onUp, { passive: false });
  canvas.addEventListener('pointercancel', onUp, { passive: false });

  // ========== Win / transition ==========
  function triggerWin() {
    if (celebrating || phase !== 'play') return;
    celebrating = true;
    phase = 'celebrate';
    celebrateTimer = 1.15;
    fillHold = 0;
    shake = 11;
    Sound.playPop();
    Sound.playChime();
    try { if (navigator.vibrate) navigator.vibrate(50); } catch (_) {}
    const c = points[0];
    spawnConfetti(c.x, c.y, 72);
    burstEl.textContent = Math.random() > 0.5 ? 'POP!' : 'PURRFECT!';
    burstEl.classList.add('show');
    setTimeout(() => burstEl.classList.remove('show'), 950);
  }

  function beginExitTransition() {
    phase = 'exit';
    transT = 0;
    transDur = 0.52;
    pendingContainerIndex = containerIndex + 1;
    Sound.playWhoosh();
  }

  function beginEnterTransition() {
    setContainer(pendingContainerIndex);
    celebrating = false;
    celebrateTimer = 0;
    buildCat(W * 0.5 - W * 0.85, H * 0.24, RADIUS());
    phase = 'enter';
    transT = 0;
    transDur = 0.58;
    containerSlide = -W * 0.92;
    particles = [];
    shake = 0;
    fillHold = 0;
  }

  function finishEnter() {
    phase = 'play';
    containerSlide = 0;
    // settle cat to center-top
    const targetX = W * 0.5;
    const targetY = H * 0.24;
    const c = points[0];
    const dx = targetX - c.x;
    const dy = targetY - c.y;
    for (let i = 0; i < points.length; i++) {
      points[i].x += dx;
      points[i].y += dy;
      points[i].ox += dx;
      points[i].oy += dy;
    }
  }

  function updateTransition(dt) {
    if (phase === 'exit') {
      transT += dt;
      const u = easeInOutCubic(clamp(transT / transDur, 0, 1));
      containerSlide = u * W * 1.05;
      // carry cat with glass a bit
      const push = (dt / transDur) * W * 1.05 * 0.35;
      for (let i = 0; i < points.length; i++) {
        points[i].x += push;
        points[i].ox += push * 0.9;
      }
      if (transT >= transDur) beginEnterTransition();
    } else if (phase === 'enter') {
      transT += dt;
      const u = easeOutCubic(clamp(transT / transDur, 0, 1));
      containerSlide = lerp(-W * 0.92, 0, u);
      const c = points[0];
      const wantX = lerp(W * 0.5 - W * 0.85, W * 0.5, u);
      const wantY = H * 0.24;
      const dx = (wantX - c.x) * 0.22;
      const dy = (wantY - c.y) * 0.18;
      for (let i = 0; i < points.length; i++) {
        points[i].x += dx;
        points[i].y += dy;
        points[i].ox += dx * 0.85;
        points[i].oy += dy * 0.85;
      }
      if (transT >= transDur) finishEnter();
    }
  }

  // ========== Render helpers ==========
  function strokeSoftBodyPath() {
    const n = OUTER_N;
    const mid = (i) => {
      const a = points[1 + i];
      const b = points[1 + ((i + 1) % n)];
      return { x: (a.x + b.x) * 0.5, y: (a.y + b.y) * 0.5 };
    };
    const first = mid(0);
    ctx.moveTo(first.x, first.y);
    for (let i = 0; i < n; i++) {
      const control = points[1 + ((i + 1) % n)];
      const end = mid((i + 1) % n);
      ctx.quadraticCurveTo(control.x, control.y, end.x, end.y);
    }
    ctx.closePath();
  }

  function avgSpokeRest() {
    let sum = 0, count = 0;
    for (let i = 0; i < springs.length; i++) {
      if (springs[i].a === 0) { sum += springs[i].rest; count++; }
    }
    return count ? sum / count : RADIUS();
  }

  function stretchRatio() {
    const rest = avgSpokeRest();
    let max = 0;
    for (let i = 1; i <= OUTER_N; i++) {
      const d = vdist(points[0], points[i]) / rest;
      if (d > max) max = d;
    }
    return max;
  }

  function sampleHullSmoothness() {
    // average absolute turn angle across midpoints (used by older step2 tests)
    const n = OUTER_N;
    const mids = [];
    for (let i = 0; i < n; i++) {
      const a = points[1 + i];
      const b = points[1 + ((i + 1) % n)];
      mids.push({ x: (a.x + b.x) * 0.5, y: (a.y + b.y) * 0.5 });
    }
    let sum = 0;
    for (let i = 0; i < n; i++) {
      const p0 = mids[(i - 1 + n) % n];
      const p1 = mids[i];
      const p2 = mids[(i + 1) % n];
      const a1 = Math.atan2(p1.y - p0.y, p1.x - p0.x);
      const a2 = Math.atan2(p2.y - p1.y, p2.x - p1.x);
      let d = a2 - a1;
      while (d > Math.PI) d -= Math.PI * 2;
      while (d < -Math.PI) d += Math.PI * 2;
      sum += Math.abs(d);
    }
    return sum / n;
  }

  function updateBlink(dt) {
    blinkT += dt;
    if (blinkAmount > 0) {
      blinkAmount = Math.max(0, blinkAmount - dt * 7.5);
    } else if (blinkT >= nextBlink) {
      blinkAmount = 1;
      blinkT = 0;
      nextBlink = 2.0 + Math.random() * 2.4;
    }
  }

  function drawBackground() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, COLORS.bgTop);
    g.addColorStop(1, COLORS.bgBot);
    ctx.fillStyle = g;
    ctx.fillRect(-24, -24, W + 48, H + 48);

    // soft ambient washes
    const a = ctx.createRadialGradient(W * 0.22, H * 0.18, 10, W * 0.22, H * 0.18, W * 0.55);
    a.addColorStop(0, 'rgba(255,255,255,0.55)');
    a.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = a;
    ctx.fillRect(-24, -24, W + 48, H + 48);

    const b = ctx.createRadialGradient(W * 0.82, H * 0.78, 8, W * 0.82, H * 0.78, W * 0.5);
    b.addColorStop(0, 'rgba(112, 214, 188, 0.16)');
    b.addColorStop(1, 'rgba(112, 214, 188, 0)');
    ctx.fillStyle = b;
    ctx.fillRect(-24, -24, W + 48, H + 48);

    // soft floor ellipse
    ctx.beginPath();
    ctx.ellipse(W * 0.5, H * 0.93, Math.min(W, H) * 0.28, Math.min(W, H) * 0.035, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(90, 70, 120, 0.07)';
    ctx.fill();
  }

  /** Surface point on the soft hull in a *world* angle from the center of mass. */
  function hullPointAtWorldAngle(c, worldAng) {
    let best = points[1];
    let bestDiff = Infinity;
    for (let i = 1; i <= OUTER_N; i++) {
      const p = points[i];
      let ang = Math.atan2(p.y - c.y, p.x - c.x);
      let d = ang - worldAng;
      while (d > Math.PI) d -= Math.PI * 2;
      while (d < -Math.PI) d += Math.PI * 2;
      d = Math.abs(d);
      if (d < bestDiff) { bestDiff = d; best = p; }
    }
    const rr = Math.hypot(best.x - c.x, best.y - c.y) || avgSpokeRest();
    // Blend toward ideal world-up circle so ears never follow a sideways spike
    const idealX = c.x + Math.cos(worldAng) * rr;
    const idealY = c.y + Math.sin(worldAng) * rr;
    return {
      x: lerp(best.x, idealX, 0.72),
      y: lerp(best.y, idealY, 0.72),
      r: rr,
    };
  }

  function drawEars(c) {
    // CRITICAL: ears are anchored to COM + world-up (−π/2), never fixed particle indices.
    const up = -Math.PI / 2;
    const tipLen = avgSpokeRest() * 0.42;
    const baseSpread = avgSpokeRest() * 0.22;

    function roundedEar(side) {
      // side: -1 left, +1 right — placed on the top of the head in screen space
      const ang = up + side * 0.42;
      const base = hullPointAtWorldAngle(c, ang);
      const ux = 0; // world up
      const uy = -1;
      const tx = side; // outward tangent-ish
      const ty = 0;
      const bx = base.x;
      const by = base.y;
      const baseL = { x: bx - tx * baseSpread * 0.55 + ux * 2, y: by - ty * baseSpread * 0.55 + uy * 2 };
      const baseR = { x: bx + tx * baseSpread * 0.55 + ux * 2, y: by + ty * baseSpread * 0.55 + uy * 2 };
      // Tip always continues upward (plus a little outward) — never rotates onto the cheek
      const tipX = bx + ux * tipLen + side * tipLen * 0.18;
      const tipY = by + uy * tipLen - tipLen * 0.06;
      const ctrlLX = lerp(baseL.x, tipX, 0.45) - side * tipLen * 0.08;
      const ctrlLY = lerp(baseL.y, tipY, 0.35);
      const ctrlRX = lerp(baseR.x, tipX, 0.45) + side * tipLen * 0.08;
      const ctrlRY = lerp(baseR.y, tipY, 0.35);

      ctx.beginPath();
      ctx.moveTo(baseL.x, baseL.y);
      ctx.quadraticCurveTo(ctrlLX, ctrlLY, tipX, tipY);
      ctx.quadraticCurveTo(ctrlRX, ctrlRY, baseR.x, baseR.y);
      ctx.closePath();
      const eg = ctx.createLinearGradient(bx, by, tipX, tipY);
      eg.addColorStop(0, COLORS.cat);
      eg.addColorStop(1, COLORS.catDeep);
      ctx.fillStyle = eg;
      ctx.fill();

      // soft inner ear oval
      const ix = lerp(bx, tipX, 0.42);
      const iy = lerp(by, tipY, 0.42);
      ctx.beginPath();
      ctx.ellipse(ix, iy, tipLen * 0.16, tipLen * 0.22, side * 0.15, 0, Math.PI * 2);
      ctx.fillStyle = COLORS.innerEar;
      ctx.fill();
    }
    roundedEar(-1);
    roundedEar(1);
  }

  function drawPaws(c) {
    const r = avgSpokeRest();
    const stressed = stretchRatio() > 1.35 || fillRatio() > 0.55;
    // Cling to vase rim when the body is near / entering the mouth
    let cling = false;
    let rimY = c.y + r * 0.55;
    let rimHalf = r * 0.55;
    if (container && phase === 'play') {
      const ox = containerSlide;
      const nearMouth = c.y > container.mouthY - r * 1.1;
      const inLane = Math.abs(c.x - (container.cx + ox)) < container.mouthW * 0.7;
      if (nearMouth && inLane) {
        cling = true;
        rimY = container.mouthY - 2;
        rimHalf = container.mouthW * 0.38;
      }
    }
    const pawY = cling ? rimY : c.y + r * (stressed ? 0.42 : 0.48);
    const pawSpread = cling ? rimHalf : r * 0.48;
    const pawR = r * (cling ? 0.16 : 0.14);

    function paw(side) {
      const px = c.x + side * pawSpread;
      const py = pawY + (cling ? -pawR * 0.15 : 0);
      // fluffy outer
      ctx.beginPath();
      ctx.ellipse(px, py, pawR * 1.15, pawR * 0.95, 0, 0, Math.PI * 2);
      ctx.fillStyle = COLORS.cat;
      ctx.fill();
      // soft pad
      ctx.beginPath();
      ctx.ellipse(px, py + pawR * 0.08, pawR * 0.55, pawR * 0.42, 0, 0, Math.PI * 2);
      ctx.fillStyle = COLORS.pawPad;
      ctx.fill();
      // toe beans
      for (let i = -1; i <= 1; i++) {
        ctx.beginPath();
        ctx.arc(px + i * pawR * 0.38, py - pawR * 0.28, pawR * 0.16, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,0.65)';
        ctx.fill();
      }
    }
    paw(-1);
    paw(1);
  }

  function drawFace(c) {
    const lookTarget = dragging ? pointer : { x: c.x + Math.sin(timeSec * 0.7) * 10, y: c.y - 14 };
    let lx = lookTarget.x - c.x;
    let ly = lookTarget.y - c.y;
    const llen = Math.hypot(lx, ly) || 1;
    lx /= llen; ly /= llen;
    const lookAmt = 5.2;
    const scale = avgSpokeRest() / 60;

    const stressed = stretchRatio() > 1.38 || fillRatio() > 0.68 || dragging;
    const happy = celebrating || fillRatio() > 0.85;
    const squinting = stressed || blinkAmount > 0.55;

    const eyeY = c.y - 7 * scale;
    const eyeSpread = 13 * scale;

    // blush — soft ellipses outside / below the eyes
    ctx.beginPath();
    ctx.ellipse(c.x - eyeSpread - 6 * scale, c.y + 4 * scale, 7.5 * scale, 4.8 * scale, 0, 0, Math.PI * 2);
    ctx.ellipse(c.x + eyeSpread + 6 * scale, c.y + 4 * scale, 7.5 * scale, 4.8 * scale, 0, 0, Math.PI * 2);
    ctx.fillStyle = COLORS.cheek;
    ctx.fill();

    function kawaiiEye(ex) {
      const ox = ex + lx * lookAmt * (squinting ? 0.25 : 1);
      const oy = eyeY + ly * lookAmt * 0.28;
      if (squinting) {
        // ⌒ ⌒ closed / squeezed arcs
        ctx.beginPath();
        ctx.strokeStyle = COLORS.ink;
        ctx.lineWidth = 2.4 * scale;
        ctx.lineCap = 'round';
        ctx.moveTo(ox - 6.5 * scale, oy + 1.5 * scale);
        ctx.quadraticCurveTo(ox, oy - 5.5 * scale, ox + 6.5 * scale, oy + 1.5 * scale);
        ctx.stroke();
        return;
      }
      // big glossy eyes
      const er = 5.4 * scale;
      ctx.beginPath();
      ctx.arc(ox, oy, er, 0, Math.PI * 2);
      ctx.fillStyle = COLORS.ink;
      ctx.fill();
      // twin specular highlights
      ctx.beginPath();
      ctx.arc(ox - er * 0.28, oy - er * 0.32, er * 0.28, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.95)';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(ox + er * 0.22, oy + er * 0.18, er * 0.14, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.fill();
    }
    kawaiiEye(c.x - eyeSpread);
    kawaiiEye(c.x + eyeSpread);

    // tiny nose
    ctx.beginPath();
    ctx.moveTo(c.x, c.y + 1.2 * scale);
    ctx.lineTo(c.x - 3.2 * scale, c.y + 5.8 * scale);
    ctx.lineTo(c.x + 3.2 * scale, c.y + 5.8 * scale);
    ctx.closePath();
    ctx.fillStyle = COLORS.face;
    ctx.fill();

    // classic cat ω mouth
    ctx.beginPath();
    ctx.strokeStyle = COLORS.face;
    ctx.lineWidth = 1.9 * scale;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    const my = c.y + 9.5 * scale;
    if (happy) {
      ctx.arc(c.x, my, 6.5 * scale, 0.12 * Math.PI, 0.88 * Math.PI);
    } else {
      // ω : two small U dips
      ctx.moveTo(c.x - 7 * scale, my);
      ctx.quadraticCurveTo(c.x - 3.5 * scale, my + 5.5 * scale, c.x, my + 1.2 * scale);
      ctx.quadraticCurveTo(c.x + 3.5 * scale, my + 5.5 * scale, c.x + 7 * scale, my);
    }
    ctx.stroke();
  }

  function drawContainer() {
    if (!container) return;
    const ox = containerSlide;
    const locked = phase === 'play' && fillRatio() >= 0.85;
    const fill = phase === 'play' ? fillRatio() : 0;
    const poly = container.path;
    const rimRx = container.mouthW * 0.5;
    const rimRy = Math.max(7, Math.min(W, H) * 0.012);

    ctx.save();
    ctx.translate(ox, 0);

    // soft table shadow under the vase
    ctx.beginPath();
    ctx.ellipse(container.cx, H * 0.915, rimRx * 0.95, 14, 0, 0, Math.PI * 2);
    const sh = ctx.createRadialGradient(container.cx, H * 0.915, 4, container.cx, H * 0.915, rimRx);
    sh.addColorStop(0, 'rgba(70, 55, 100, 0.16)');
    sh.addColorStop(1, 'rgba(70, 55, 100, 0)');
    ctx.fillStyle = sh;
    ctx.fill();

    // frosted glass body fill
    ctx.beginPath();
    ctx.moveTo(poly[0].x, poly[0].y);
    for (let i = 1; i < poly.length; i++) ctx.lineTo(poly[i].x, poly[i].y);
    ctx.closePath();
    const gf = ctx.createLinearGradient(container.cx, container.mouthY, container.cx, H * 0.9);
    gf.addColorStop(0, COLORS.glassFillTop);
    gf.addColorStop(0.45, COLORS.glassFrost);
    gf.addColorStop(1, COLORS.glassFillBot);
    ctx.fillStyle = gf;
    ctx.fill();

    // fill progress wash (cat juice rising)
    if (fill > 0.05) {
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(poly[0].x, poly[0].y);
      for (let i = 1; i < poly.length; i++) ctx.lineTo(poly[i].x, poly[i].y);
      ctx.closePath();
      ctx.clip();
      const top = lerp(H * 0.86, container.neckY - 8, clamp(fill, 0, 1));
      const pg = ctx.createLinearGradient(0, top, 0, H * 0.9);
      pg.addColorStop(0, 'rgba(255, 158, 158, 0.0)');
      pg.addColorStop(0.4, `rgba(255, 158, 158, ${0.10 + fill * 0.14})`);
      pg.addColorStop(1, `rgba(255, 120, 150, ${0.12 + fill * 0.18})`);
      ctx.fillStyle = pg;
      ctx.fillRect(container.cx - container.mouthW, top, container.mouthW * 2, H);
      ctx.restore();
    }

    // wall stroke — mint frosted, round joins, ~4px
    ctx.beginPath();
    for (let s = 0; s < container.segments.length; s++) {
      const seg = container.segments[s];
      ctx.moveTo(seg.ax, seg.ay);
      ctx.lineTo(seg.bx, seg.by);
    }
    ctx.strokeStyle = locked ? COLORS.lock : COLORS.glass;
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    if (locked) {
      ctx.shadowColor = COLORS.lock;
      ctx.shadowBlur = 14;
    } else if (fill > 0.4) {
      ctx.shadowColor = 'rgba(112, 214, 188, 0.4)';
      ctx.shadowBlur = 8 + fill * 8;
    }
    ctx.stroke();
    ctx.shadowBlur = 0;

    // rim flange — full ellipse ring with thickness (not open wire ends)
    ctx.beginPath();
    ctx.ellipse(container.cx, container.mouthY, rimRx, rimRy, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.42)';
    ctx.fill();
    ctx.strokeStyle = locked ? COLORS.lock : COLORS.glass;
    ctx.lineWidth = 3.5;
    ctx.stroke();
    // inner rim highlight
    ctx.beginPath();
    ctx.ellipse(container.cx, container.mouthY + 1, rimRx * 0.78, rimRy * 0.55, 0, 0, Math.PI * 2);
    ctx.strokeStyle = COLORS.glassRim;
    ctx.lineWidth = 1.8;
    ctx.stroke();

    // left specular streak
    ctx.beginPath();
    const leftSeg = container.segments[0];
    ctx.moveTo(leftSeg.ax + 4, leftSeg.ay + 10);
    ctx.lineTo(leftSeg.bx + 4, leftSeg.by - 10);
    ctx.strokeStyle = 'rgba(255,255,255,0.4)';
    ctx.lineWidth = 2.2;
    ctx.lineCap = 'round';
    ctx.stroke();

    if (container.id === 'goblet') {
      ctx.beginPath();
      ctx.moveTo(container.cx, container.neckY + 6);
      ctx.lineTo(container.cx, H * 0.83);
      ctx.strokeStyle = 'rgba(255,255,255,0.22)';
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    ctx.restore();
  }

  function drawCatShadow(c) {
    const r = avgSpokeRest();
    ctx.beginPath();
    ctx.ellipse(c.x + 2, c.y + r * 0.92, r * 0.72, r * 0.18, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(80, 55, 110, 0.10)';
    ctx.fill();
  }

  function draw() {
    const ox = shake > 0 ? (Math.random() - 0.5) * shake : 0;
    const oy = shake > 0 ? (Math.random() - 0.5) * shake : 0;
    ctx.save();
    ctx.translate(ox, oy);

    ctx.clearRect(-30, -30, W + 60, H + 60);
    drawBackground();
    drawContainer();

    const c = points[0];
    drawCatShadow(c);
    drawEars(c);

    // body
    ctx.beginPath();
    strokeSoftBodyPath();
    const grad = ctx.createRadialGradient(c.x - 20, c.y - 24, 6, c.x, c.y, avgSpokeRest() * 1.25);
    grad.addColorStop(0, '#FFC2C8');
    grad.addColorStop(0.45, COLORS.cat);
    grad.addColorStop(0.82, COLORS.catMid);
    grad.addColorStop(1, COLORS.catDeep);
    ctx.fillStyle = grad;
    ctx.fill();

    // jelly highlight
    ctx.beginPath();
    ctx.ellipse(c.x - 18, c.y - 22, 20, 13, -0.45, 0, Math.PI * 2);
    ctx.fillStyle = COLORS.highlight;
    ctx.fill();

    // secondary smaller gloss
    ctx.beginPath();
    ctx.ellipse(c.x + 10, c.y - 8, 6, 4, 0.3, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.28)';
    ctx.fill();

    ctx.beginPath();
    strokeSoftBodyPath();
    ctx.strokeStyle = 'rgba(255, 82, 119, 0.18)';
    ctx.lineWidth = 2.2;
    ctx.stroke();

    drawFace(c);
    drawPaws(c);
    drawParticles();
    ctx.restore();
  }

  function frame(t) {
    if (!lastTime) lastTime = t;
    let dt = (t - lastTime) / 1000;
    lastTime = t;
    dt = Math.min(dt, 0.033);
    const dtScale = dt / (1 / 60);
    timeSec += dt;

    if (thudCooldown > 0) thudCooldown -= dt;
    if (squishCooldown > 0) squishCooldown -= dt;
    if (shake > 0) shake = Math.max(0, shake - dt * 28);
    updateBlink(dt);

    if (phase === 'play') {
      const steps = 2;
      for (let i = 0; i < steps; i++) {
        verletIntegrate(dtScale / steps);
        applyDrag();
        satisfyConstraints();
      }
      const ratio = fillRatio();
      if (ratio >= 0.85) {
        fillHold += dt;
        if (fillHold >= 0.8) triggerWin();
      } else {
        fillHold = Math.max(0, fillHold - dt * 1.5);
      }
    } else if (phase === 'celebrate') {
      celebrateTimer -= dt;
      verletIntegrate(dtScale * 0.3);
      satisfyConstraints();
      if (celebrateTimer <= 0) beginExitTransition();
    } else if (phase === 'exit' || phase === 'enter') {
      verletIntegrate(dtScale * 0.45);
      satisfyConstraints();
      updateTransition(dt);
    }

    updateParticles(dt);
    // lightweight fill HUD
    if (fillHud && phase === 'play') {
      const pct = Math.round(fillRatio() * 100);
      fillHud.textContent = pct + '% Full';
      fillHud.style.color = pct >= 85
        ? 'rgba(56, 239, 125, 0.85)'
        : 'rgba(90, 69, 112, 0.45)';
    } else if (fillHud && (phase === 'celebrate' || phase === 'exit')) {
      fillHud.textContent = 'POP!';
    } else if (fillHud) {
      fillHud.textContent = '0% Full';
    }
    draw();
    requestAnimationFrame(frame);
  }

  function init() {
    resize();
    setContainer(0);
    buildCat(W * 0.5, H * 0.24, RADIUS());
    lastTime = 0;
    phase = 'play';
    containerSlide = 0;
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', () => {
    resize();
    if (phase === 'play' || phase === 'celebrate') {
      setContainer(containerIndex);
      buildCat(W * 0.5, H * 0.24, RADIUS());
    }
  });

  window.__liquidCat = {
    version: 'step3',
    getPointCount: () => points.length,
    getOuterCount: () => OUTER_N,
    getCenter: () => ({ x: points[0].x, y: points[0].y }),
    isDragging: () => dragging,
    getDragIndex: () => dragIndex,
    getFillRatio: () => fillRatio(),
    getFillHold: () => fillHold,
    getContainerId: () => (container ? container.id : null),
    getContainerIndex: () => containerIndex,
    isCelebrating: () => celebrating,
    getParticleCount: () => particles.length,
    getStretchRatio: () => stretchRatio(),
    sampleHullSmoothness: () => sampleHullSmoothness(),
    getPhase: () => phase,
    getMouth: () => container ? {
      x: container.mouthX + containerSlide,
      y: container.mouthY,
      w: container.mouthW,
      neckY: container.neckY,
    } : null,
    debugPackIntoContainer: () => {
      if (!container || phase === 'exit' || phase === 'enter') return;
      const cx = container.cx + containerSlide;
      const cy = (container.neckY + H * 0.88) * 0.5;
      const r = Math.min(container.mouthW * 0.28, (H * 0.88 - container.neckY) * 0.28);
      buildCat(cx, cy, r);
      for (let k = 0; k < 30; k++) satisfyConstraints();
    },
    debugTriggerWin: () => triggerWin(),
  };

  init();
})();
  </script>
</body>
