<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Sling-Cat: Liquid Cannon</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#EDE8F8;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
'use strict';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const N = 16, PI2 = Math.PI * 2, H120 = 1 / 120, DAMP = 0.9996, K = 12.5;
const cl = (v, a, b) => v < a ? a : v > b ? b : v;
const rnd = (a, b) => a + Math.random() * (b - a);
const ASSET = 'assets/game/';

const IMG_KEYS = [
  'chopsticks', 'bamboo_poles', 'sling_with_cat', 'pouch_launch', 'btn_launch',
  'cat_idle', 'cat_happy', 'cat_fly', 'cat_ball', 'cat_squeeze1', 'cat_squeeze2', 'cat_chopstick_happy',
  'vase_teal', 'vase_blue', 'jar_teal', 'bowl_blue',
  'progress_bar', 'ui_level_word', 'ui_tap_to_aim', 'ui_to', 'ui_aim', 'ui_try', 'ui_again',
  'star_pink', 'star_yellow', 'star_sm', 'star_spark', 'paw1', 'paw2'
];
const imgs = {};
let assetsReady = false, assetsFailed = 0;

function loadAssets() {
  let left = IMG_KEYS.length;
  return Promise.all(IMG_KEYS.map(k => new Promise(res => {
    const im = new Image();
    im.onload = () => { imgs[k] = im; if (--left === 0) assetsReady = true; res(); };
    im.onerror = () => { assetsFailed++; if (--left === 0) assetsReady = true; res(); };
    im.src = ASSET + k + '.png';
  })));
}

function drawImg(key, x, y, w, h, rot, alpha, pivotX, pivotY) {
  const im = imgs[key];
  if (!im || !im.complete || !im.naturalWidth) return false;
  ctx.save();
  if (alpha != null) ctx.globalAlpha = alpha;
  ctx.translate(x, y);
  if (rot) ctx.rotate(rot);
  const px = pivotX == null ? 0.5 : pivotX, py = pivotY == null ? 0.5 : pivotY;
  ctx.drawImage(im, -w * px, -h * py, w, h);
  ctx.restore();
  return true;
}

let W = 0, H = 0, u = 1, dpr = 1, bgGrad = null;
let state = 'aim', stateT = 0, time = 0, shake = 0, score = 0, hintA = 1, level = 1;
let dragging = false, flyT = 0, calmT = 0, impact = 0, thudCD = 0;
const A = { x: 0, y: 0 }, pull = { x: 0, y: 0 };
const V = { x: 0, hw: 0, t: 0, b: 0, th: 0, rects: [], kind: 'vase_teal' };
const VASE_KINDS = ['vase_teal', 'vase_blue', 'jar_teal', 'bowl_blue'];
const px = new Float64Array(N + 1), py = new Float64Array(N + 1);
const ox = new Float64Array(N + 1), oy = new Float64Array(N + 1);
let R = 30, S = 1, stars = [], conf = [], amb = [];
const burstEl = document.createElement('div');
burstEl.id = 'burst';
burstEl.style.display = 'none';
document.body.appendChild(burstEl);

const cons = [];
for (let k = 0; k < N; k++) {
  const i = k + 1, j = (k + 1) % N + 1, j2 = (k + 2) % N + 1;
  cons.push([i, j, 2 * Math.sin(Math.PI / N), 0.9]);
  cons.push([0, i, 1, 0.35]);
  cons.push([i, j2, 2 * Math.sin(2 * Math.PI / N), 0.35]);
}

/* ---------------- Audio ---------------- */
let ac = null, sOsc = null, sGain = null, nBuf = null;
function unlock() {
  try {
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      ac = new AC();
      nBuf = ac.createBuffer(1, ac.sampleRate * 0.2, ac.sampleRate);
      const d = nBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (ac.state === 'suspended') ac.resume();
  } catch (e) {}
}
function tone(type, f0, f1, dur, vol, delay) {
  if (!ac) return;
  const t = ac.currentTime + (delay || 0), o = ac.createOscillator(), g = ac.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + Math.min(dur, 0.12));
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(ac.destination);
  o.start(t); o.stop(t + dur + 0.05);
}
function thud(v) {
  if (!ac) return;
  const t = ac.currentTime, s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = nBuf; f.type = 'lowpass'; f.frequency.value = 260;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.5 * v + 0.05, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
  s.connect(f); f.connect(g); g.connect(ac.destination);
  s.start(t); s.stop(t + 0.2);
  tone('sine', 120, 60, 0.15, 0.25 * v + 0.03);
}
function startStretch() {
  if (!ac || sOsc) return;
  sOsc = ac.createOscillator(); sGain = ac.createGain();
  sOsc.type = 'sine'; sOsc.frequency.value = 100;
  sGain.gain.setValueAtTime(0.0001, ac.currentTime);
  sGain.gain.linearRampToValueAtTime(0.06, ac.currentTime + 0.05);
  sOsc.connect(sGain); sGain.connect(ac.destination); sOsc.start();
}
function setStretch(t) { if (sOsc) sOsc.frequency.setTargetAtTime(100 + 180 * t, ac.currentTime, 0.03); }
function stopStretch() {
  if (!sOsc) return;
  const o = sOsc, g = sGain; sOsc = null;
  g.gain.cancelScheduledValues(ac.currentTime);
  g.gain.setValueAtTime(Math.max(g.gain.value, 0.0001), ac.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + 0.06);
  o.stop(ac.currentTime + 0.08);
}
function winSound() {
  tone('sine', 180, 900, 0.14, 0.4);
  tone('sine', 1046.5, 1046.5, 0.9, 0.16, 0.06);
  tone('sine', 1568, 1568, 0.9, 0.12, 0.06);
}

/* ---------------- Setup ---------------- */
function initCat() {
  R = 34 * u; S = 1;
  px[0] = A.x; py[0] = A.y;
  for (let k = 0; k < N; k++) {
    const a = k / N * PI2;
    px[k + 1] = A.x + Math.cos(a) * R; py[k + 1] = A.y + Math.sin(a) * R;
  }
  for (let i = 0; i <= N; i++) { ox[i] = px[i]; oy[i] = py[i]; }
}
function placeVase() {
  V.hw = 52 * u; V.th = 6 * u;
  V.t = H * rnd(0.20, 0.28); V.b = V.t + 148 * u;
  const m = V.hw + V.th + 10 * u;
  V.x = rnd(Math.max(m, W * 0.28), Math.min(W - m, W * 0.72));
  V.kind = VASE_KINDS[(level - 1) % VASE_KINDS.length];
  const r = 4 * u, x0 = V.x - V.hw, x1 = V.x + V.hw;
  // Side walls + floor only — open mouth gateway (no top rim collider)
  V.rects = [
    [x0 - V.th - r, V.t + 8 * u, x0 + r, V.b + V.th + r],
    [x1 - r, V.t + 8 * u, x1 + V.th + r, V.b + V.th + r],
    [x0 - V.th - r, V.b - r, x1 + V.th + r, V.b + V.th + r]
  ];
}
function resetRound(newVase) {
  state = 'aim'; stateT = 0; flyT = 0; calmT = 0;
  initCat();
  if (newVase) placeVase();
}
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  u = cl(Math.min(W, H * 0.55) / 390, 0.55, 1.7);
  A.x = W * 0.38; A.y = H * 0.78;
  bgGrad = ctx.createLinearGradient(0, 0, 0, H);
  bgGrad.addColorStop(0, '#EDE8F8');
  bgGrad.addColorStop(0.55, '#F6EEF8');
  bgGrad.addColorStop(1, '#FFE8F0');
  stars = []; amb = [];
  for (let i = 0; i < 14; i++) stars.push({
    x: rnd(0, W), y: rnd(0, H * 0.7), r: rnd(2.2, 4.5) * u, ph: rnd(0, PI2),
    kind: i % 4 === 0 ? 'paw1' : (i % 2 ? 'star_pink' : 'star_yellow')
  });
  for (let i = 0; i < 10; i++) amb.push({
    x: rnd(0, W), y: rnd(0, H), vy: rnd(8, 18) * u, rot: rnd(0, PI2), vr: rnd(-0.8, 0.8),
    size: rnd(6, 11) * u, kind: i % 3 === 0 ? 'paw2' : 'star_sm'
  });
  if (state === 'aim' || state === 'pull') { dragging = false; resetRound(true); }
  else placeVase();
}

/* ---------------- Physics ---------------- */
function area() {
  let a = 0;
  for (let k = 0; k < N; k++) {
    const i = k + 1, j = (k + 1) % N + 1;
    a += px[i] * py[j] - px[j] * py[i];
  }
  return a / 2;
}
function hit(i, nx, ny, pen) {
  const vx = px[i] - ox[i], vy = py[i] - oy[i];
  px[i] += nx * pen; py[i] += ny * pen;
  const vn = vx * nx + vy * ny;
  if (vn < 0) {
    const nvx = (vx - vn * nx) * 0.92 - vn * nx * 0.25;
    const nvy = (vy - vn * ny) * 0.92 - vn * ny * 0.25;
    ox[i] = px[i] - nvx; oy[i] = py[i] - nvy;
    impact = Math.max(impact, -vn / H120);
  }
}
function collide() {
  const r = 4 * u;
  for (let i = 0; i <= N; i++) {
    if (px[i] < r) hit(i, 1, 0, r - px[i]);
    else if (px[i] > W - r) hit(i, -1, 0, px[i] - (W - r));
    if (py[i] > H - r) hit(i, 0, -1, py[i] - (H - r));
    for (const q of V.rects) {
      const x = px[i], y = py[i];
      if (x > q[0] && x < q[2] && y > q[1] && y < q[3]) {
        const a = x - q[0], b = q[2] - x, c = y - q[1], d = q[3] - y, m = Math.min(a, b, c, d);
        if (m === a) hit(i, -1, 0, a); else if (m === b) hit(i, 1, 0, b);
        else if (m === c) hit(i, 0, -1, c); else hit(i, 0, 1, d);
      }
    }
  }
}
function com() {
  let x = 0, y = 0;
  for (let i = 0; i <= N; i++) { x += px[i]; y += py[i]; }
  return { x: x / (N + 1), y: y / (N + 1) };
}
function step(h) {
  const hh = h * h, g = 1150 * u, pinned = state === 'aim' || state === 'pull';
  const c = com();
  let vcx = 0, vcy = 0;
  for (let i = 0; i <= N; i++) { vcx += px[i] - ox[i]; vcy += py[i] - oy[i]; }
  vcx /= N + 1; vcy /= N + 1;
  let fx = 0, fy = 0;
  if (state === 'fly') {
    const tx = V.x, ty = V.t + 24 * u, dx = tx - c.x, dy = ty - c.y, d = Math.hypot(dx, dy), D = 1.3 * V.hw * 2;
    if (c.y < V.t + 10 * u && d < D && vcy / h > -80 * u) {
      const w = 1 - d / D, f = 3400 * u * w * w;
      fx += dx / (d || 1) * f; fy += dy / (d || 1) * f;
      fx += -dy / (d || 1) * f * 0.15;
    } else if (Math.abs(c.x - V.x) < V.hw && c.y > V.t && c.y < V.b) {
      fx += (V.x - c.x) * 18;
    }
  }
  for (let i = 0; i <= N; i++) {
    const x = px[i], y = py[i];
    px[i] = x + (x - ox[i]) * DAMP + fx * hh;
    py[i] = y + (y - oy[i]) * DAMP + (g + fy) * hh;
    ox[i] = x; oy[i] = y;
  }
  if (pinned) {
    const t = state === 'pull' ? pull : { x: A.x, y: A.y + Math.sin(time * 2.2) * 2 * u };
    px[0] += (t.x - px[0]) * 0.4; py[0] += (t.y - py[0]) * 0.4;
    ox[0] = px[0]; oy[0] = py[0];
  }
  if (state === 'win') S += ((V.hw * 0.85) / R - S) * Math.min(1, h * 9);
  const rs = R * S, tgt = 0.5 * N * Math.sin(PI2 / N) * rs * rs;
  for (let it = 0; it < 4; it++) {
    for (const [i, j, rest, k] of cons) {
      const dx = px[j] - px[i], dy = py[j] - py[i], d = Math.hypot(dx, dy) || 1e-6;
      const diff = (d - rest * rs) / d * k;
      const wi = (i === 0 && pinned) ? 0 : 1, wj = (j === 0 && pinned) ? 0 : 1, sw = wi + wj;
      if (!sw) continue;
      px[i] += dx * diff * wi / sw; py[i] += dy * diff * wi / sw;
      px[j] -= dx * diff * wj / sw; py[j] -= dy * diff * wj / sw;
    }
    const a = area();
    if (a > 0 && a < tgt) {
      const dd = (tgt - a) / (N * 2 * rs * Math.sin(Math.PI / N)) * 0.5;
      for (let k = 0; k < N; k++) {
        const i = k + 1, p = (k + N - 1) % N + 1, n = (k + 1) % N + 1;
        const tx = px[n] - px[p], ty = py[n] - py[p], l = Math.hypot(tx, ty) || 1;
        px[i] += ty / l * dd; py[i] -= tx / l * dd;
      }
    }
  }
  collide();
  let ax = 0, ay = 0;
  for (let i = 0; i <= N; i++) { ax += px[i] - ox[i]; ay += py[i] - oy[i]; }
  ax /= N + 1; ay /= N + 1;
  for (let i = 0; i <= N; i++) {
    const vx = ax + (px[i] - ox[i] - ax) * 0.985, vy = ay + (py[i] - oy[i] - ay) * 0.985;
    ox[i] = px[i] - vx; oy[i] = py[i] - vy;
  }
}

/* ---------------- Game flow ---------------- */
function launch() {
  const vx = (A.x - pull.x) * K, vy = (A.y - pull.y) * K;
  for (let i = 0; i <= N; i++) { ox[i] = px[i] - vx * H120; oy[i] = py[i] - vy * H120; }
  state = 'fly'; stateT = 0; flyT = 0; calmT = 0; hintA = Math.min(hintA, 0.99);
  tone('sine', 320, 110, 0.14, 0.16);
}
function inVase() {
  let n = 0;
  for (let i = 0; i <= N; i++)
    if (px[i] > V.x - V.hw && px[i] < V.x + V.hw && py[i] > V.t && py[i] < V.b) n++;
  return n;
}
function fillRatio() { return inVase() / (N + 1); }
function win() {
  state = 'win'; stateT = 0; score++; shake = 1;
  winSound();
  burstEl.classList.add('show');
  setTimeout(() => burstEl.classList.remove('show'), 2000);
  for (let i = 0; i < 70; i++)
    conf.push({
      x: V.x + rnd(-V.hw, V.hw), y: V.t, vx: rnd(-420, 420) * u, vy: -rnd(300, 900) * u,
      rot: rnd(0, PI2), vr: rnd(-8, 8), size: rnd(10, 18) * u,
      kind: i % 3 === 0 ? 'paw1' : (i % 3 === 1 ? 'star_pink' : 'star_yellow'), life: 1
    });
}
function update(dt) {
  stateT += dt; thudCD -= dt;
  shake = Math.max(0, shake - dt * 2.5);
  if (impact > 380 * u && thudCD <= 0) { thud(Math.min(1, impact / (1300 * u))); thudCD = 0.09; }
  impact = 0;
  for (let i = conf.length - 1; i >= 0; i--) {
    const p = conf[i];
    p.vy += 900 * u * dt; p.vx *= 1 - 1.2 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    if (p.y > H + 30) conf.splice(i, 1);
  }
  for (const p of amb) { p.y += p.vy * dt; p.rot += p.vr * dt; if (p.y > H + 10) { p.y = -10; p.x = rnd(0, W); } }
  if (state === 'fly') {
    flyT += dt;
    // Brief fly window so debug/place + natural entry both register as flight first
    if (flyT > 0.12 && inVase() >= Math.ceil(0.8 * (N + 1))) { win(); return; }
    const c = com(), sp = Math.hypot(px[0] - ox[0], py[0] - oy[0]) / H120;
    calmT = (sp < 60 * u && c.y > H * 0.8) ? calmT + dt : 0;
    if (calmT > 0.9 || flyT > 7) resetRound(false);
  } else if (state === 'win' && stateT > 2.5) {
    level++;
    resetRound(true);
  }
}

/* ---------------- Rendering ---------------- */
function drawBg() {
  ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, W, H);
  for (const s of stars) {
    const a = 0.25 + 0.35 * Math.sin(time * 1.6 + s.ph);
    if (!drawImg(s.kind, s.x, s.y, s.r * 2.4, s.r * 2.4, s.ph * 0.2, a)) {
      ctx.globalAlpha = a; ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, PI2); ctx.fill(); ctx.globalAlpha = 1;
    }
  }
  for (const p of amb) {
    if (!drawImg(p.kind, p.x, p.y, p.size, p.size, p.rot, 0.4)) {
      ctx.globalAlpha = 0.35; ctx.fillStyle = '#D8C8F0';
      ctx.fillRect(p.x - p.size * 0.3, p.y - p.size * 0.3, p.size * 0.6, p.size * 0.6);
      ctx.globalAlpha = 1;
    }
  }
}

function drawChopsticksFork() {
  // Bamboo chopsticks as the slingshot frame (user art)
  const tipX = A.x + 28 * u, tipY = A.y - 18 * u;
  const w = 210 * u, h = w * (288 / 605);
  // Asset points down-right; rotate so tips face up-right toward the vase
  const rot = -0.95;
  drawImg('chopsticks', tipX, tipY + 40 * u, w, h, rot, 1, 0.15, 0.55);
}

function drawBand(c, rr, t) {
  // Elastic loop between chopsticks tip and cat
  const ax = A.x + 36 * u, ay = A.y - 22 * u;
  const bx = c.x, by = c.y + rr * 0.15;
  const mx = (ax + bx) / 2, my = (ay + by) / 2;
  const dx = bx - ax, dy = by - ay, len = Math.hypot(dx, dy) || 1;
  const ang = Math.atan2(dy, dx);
  const bw = Math.max(70 * u, len * 1.05), bh = (22 - 6 * t) * u;
  if (!drawImg('bamboo_poles', mx, my, bw, bh, ang, 0.95)) {
    ctx.strokeStyle = '#C9A07A'; ctx.lineWidth = (8 - 3 * t) * u; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx - rr * 0.5, by); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(ax + 18 * u, ay + 10 * u); ctx.lineTo(bx + rr * 0.5, by); ctx.stroke();
  }
}

function drawVase() {
  const vh = (V.b - V.t) * 1.18;
  const vw = vh * 0.72;
  const cy = (V.t + V.b) / 2 + 4 * u;
  const key = V.kind || 'vase_teal';
  if (!drawImg(key, V.x, cy, vw, vh, 0, 1)) {
    ctx.fillStyle = 'rgba(112,214,188,0.35)';
    ctx.strokeStyle = '#70D6BC'; ctx.lineWidth = 6 * u;
    ctx.beginPath();
    ctx.moveTo(V.x - V.hw, V.t);
    ctx.lineTo(V.x - V.hw, V.b);
    ctx.lineTo(V.x + V.hw, V.b);
    ctx.lineTo(V.x + V.hw, V.t);
    ctx.stroke();
  }
  // Soft mouth highlight so entry reads clearly
  ctx.save();
  ctx.globalAlpha = 0.35;
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.ellipse(V.x, V.t + 4 * u, V.hw * 0.85, 9 * u, 0, 0, PI2); ctx.fill();
  ctx.restore();
}

function catSpriteKey() {
  if (state === 'win') return 'cat_happy';
  if (state === 'fly') return flyT < 0.28 ? 'cat_fly' : 'cat_ball';
  if (state === 'pull') return 'cat_fly';
  return 'cat_idle';
}

function drawCat(c, rr) {
  const pt = state === 'pull' ? Math.min(1, Math.hypot(pull.x - A.x, pull.y - A.y) / (120 * u)) : 0;
  const key = catSpriteKey();

  let rot = 0;
  if (state === 'pull') rot = Math.atan2(A.y - pull.y, A.x - pull.x) - Math.PI / 2;
  else if (state === 'fly') rot = cl((px[0] - ox[0]) / H120 / 3500, -0.45, 0.45);
  else if (state === 'aim') rot = Math.sin(time * 2.2) * 0.04;

  const stretch = state === 'pull' ? 1 + 0.28 * pt : (state === 'fly' ? 1.06 : 1);
  const squash = state === 'pull' ? 1 - 0.2 * pt : (state === 'win' ? 0.92 : 1);
  const size = rr * 2.55 * (state === 'win' ? S * 1.05 : 1);
  const w = size * stretch, h = size * squash;

  ctx.save();
  ctx.translate(c.x, c.y + (state === 'aim' ? Math.sin(time * 2.2) * 2 * u : 0));
  ctx.rotate(rot);
  if (!drawImg(key, 0, 0, w, h, 0, 1)) {
    ctx.fillStyle = '#FF7A97';
    ctx.beginPath(); ctx.ellipse(0, 0, rr, rr * 0.95, 0, 0, PI2); ctx.fill();
  }
  ctx.restore();
}

function trajectory() {
  let x = pull.x, y = pull.y, vx = (A.x - pull.x) * K, vy = (A.y - pull.y) * K;
  const h = 1 / 60, g = 1150 * u, d = Math.pow(DAMP, 2);
  for (let k = 0; k < 90; k++) {
    vy += g * h; vx *= d; vy *= d; x += vx * h; y += vy * h;
    if (y > H || x < 0 || x > W) break;
    if (k % 2 === 0 && k > 2) {
      const sz = (5.2 - k / 38) * u;
      if (!drawImg('star_sm', x, y, sz * 2, sz * 2, 0, 0.85)) {
        ctx.fillStyle = 'rgba(160,120,220,0.75)';
        ctx.beginPath(); ctx.arc(x, y, sz * 0.7, 0, PI2); ctx.fill();
      }
    }
  }
}

function drawHUD() {
  const barW = Math.min(W * 0.62, 280 * u), barH = barW * (100 / 691);
  const bx = W / 2, by = 36 * u + barH / 2;
  drawImg('progress_bar', bx, by, barW, barH, 0, 1);

  const fill = state === 'win' ? 1 : (state === 'fly' ? Math.min(1, fillRatio()) : 0);

  // LEVEL word + number (left)
  const lw = 72 * u, lh = lw * (56 / 161);
  drawImg('ui_level_word', 16 * u + lw / 2, by - 2 * u, lw, lh, 0, 1);
  ctx.font = '800 ' + 15 * u + 'px ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold",system-ui,sans-serif';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#4A3B6B';
  ctx.fillText(String(level).padStart(2, '0'), 16 * u + lw + 4 * u, by);

  ctx.textAlign = 'right';
  ctx.fillText(Math.round(fill * 100) + '% FULL', W - 16 * u, by);

  if (hintA > 0.01 && state === 'aim') {
    if (hintA < 1) hintA -= 0.015;
    const pulse = 0.75 + 0.25 * Math.sin(time * 3);
    const y = H * 0.36;
    const tw = 72 * u, th = tw * (79 / 166);
    const toW = 48 * u, aimW = 78 * u;
    drawImg('ui_tap_to_aim', W / 2 - 70 * u, y, tw, th, 0, hintA * pulse);
    drawImg('ui_to', W / 2 - 8 * u, y, toW, toW, 0, hintA * pulse);
    drawImg('ui_aim', W / 2 + 62 * u, y, aimW, aimW * (79 / 180), 0, hintA * pulse);
  }

  if (state === 'aim' || state === 'pull') {
    const bw = 168 * u, bh = bw * (194 / 340);
    drawImg('btn_launch', W / 2, H - 22 * u - bh / 2, bw, bh, 0, state === 'pull' ? 0.5 : 0.95);
  }

  if (state === 'win') {
    const sc = Math.min(1, stateT / 0.35);
    const al = stateT > 2.1 ? Math.max(0, 1 - (stateT - 2.1) / 0.4) : 1;
    ctx.save();
    ctx.globalAlpha = al;
    ctx.translate(W / 2, H * 0.44);
    ctx.scale(0.85 + 0.15 * sc, 0.85 + 0.15 * sc);
    ctx.font = '900 ' + 42 * u + 'px ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold",system-ui,sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round';
    ctx.lineWidth = 10 * u; ctx.strokeStyle = '#4A3B6B'; ctx.strokeText('100% FULL', 0, 0);
    ctx.fillStyle = '#FFF6B8'; ctx.fillText('100% FULL', 0, 0);
    ctx.restore();
    drawImg('star_spark', W / 2 - 90 * u, H * 0.44 - 40 * u, 36 * u, 36 * u, time, al);
    drawImg('star_spark', W / 2 + 95 * u, H * 0.44 + 20 * u, 28 * u, 28 * u, -time * 1.3, al);
  }

  if (state === 'fly' && calmT > 0.35) {
    const a = Math.min(1, calmT);
    drawImg('ui_try', W / 2 - 55 * u, H * 0.42, 90 * u, 48 * u, 0, a);
    drawImg('ui_again', W / 2 + 55 * u, H * 0.42, 120 * u, 48 * u, 0, a);
  }
}

function draw() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.globalAlpha = 1;
  drawBg();
  ctx.save();
  if (shake > 0) ctx.translate(rnd(-1, 1) * 10 * u * shake, rnd(-1, 1) * 10 * u * shake);

  if (state !== 'win') drawChopsticksFork();

  const c = com();
  let rr = 0;
  for (let k = 1; k <= N; k++) rr += Math.hypot(px[k] - c.x, py[k] - c.y);
  rr /= N;
  const t = state === 'pull' ? Math.min(1, Math.hypot(pull.x - A.x, pull.y - A.y) / (120 * u)) : 0;

  if (state === 'aim' || state === 'pull') drawBand(c, rr, t);
  if (state === 'pull') trajectory();

  // Cat behind vase rim when entering / inside
  const insideish = (state === 'fly' || state === 'win') && c.y > V.t - 8 * u && Math.abs(c.x - V.x) < V.hw * 1.2;
  if (!insideish) drawCat(c, rr);
  drawVase();
  if (insideish) drawCat(c, rr);

  ctx.restore();
  for (const p of conf) drawImg(p.kind, p.x, p.y, p.size, p.size, p.rot, 1);
  ctx.globalAlpha = 1;
  drawHUD();
}

/* ---------------- Input ---------------- */
function pt(e) { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
function setPull(p) {
  let dx = p.x - A.x, dy = Math.max(p.y - A.y, -10 * u);
  const l = Math.hypot(dx, dy), m = 120 * u;
  if (l > m) { dx *= m / l; dy *= m / l; }
  pull.x = A.x + dx; pull.y = A.y + dy;
  setStretch(Math.min(1, Math.hypot(dx, dy) / m));
}
cv.addEventListener('pointerdown', e => {
  unlock();
  e.preventDefault();
  if (state !== 'aim') return;
  const p = pt(e);
  // Allow aiming from lower half OR tapping near the launch pouch
  if (p.y < H * 0.42 && Math.hypot(p.x - W / 2, p.y - (H - 50 * u)) > 90 * u) return;
  dragging = true;
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  state = 'pull'; setPull(p); startStretch();
});
cv.addEventListener('pointermove', e => { if (dragging) { e.preventDefault(); setPull(pt(e)); } });
function release() {
  if (!dragging) return;
  dragging = false; stopStretch();
  if (Math.hypot(pull.x - A.x, pull.y - A.y) < 24 * u) { state = 'aim'; return; }
  launch();
}
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', release);
for (const ev of ['touchstart', 'touchmove', 'touchend']) document.addEventListener(ev, e => e.preventDefault(), { passive: false });
document.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', resize);

/* ---------------- Debug / e2e API ---------------- */
function mapPhase() {
  if (state === 'aim') return 'idle';
  if (state === 'pull') return 'aim';
  return state;
}
function placeCatInVase() {
  const cx = V.x, cy = (V.t + V.b) / 2;
  R = Math.min(R, V.hw * 0.7);
  px[0] = cx; py[0] = cy;
  for (let k = 0; k < N; k++) {
    const a = k / N * PI2;
    px[k + 1] = cx + Math.cos(a) * R * 0.85;
    py[k + 1] = cy + Math.sin(a) * R * 0.85;
  }
  for (let i = 0; i <= N; i++) { ox[i] = px[i]; oy[i] = py[i]; }
  state = 'fly'; stateT = 0; flyT = 0; calmT = 0;
}
function launchTowardVase() {
  const c = com();
  pull.x = A.x - (V.x - A.x) * 0.35;
  pull.y = A.y + 70 * u;
  setPull(pull);
  launch();
}

window.__sling = { st: () => state, V, A, score: () => score, getU: () => u };
window.__slingCat = {
  version: 'sling1',
  getPhase: mapPhase,
  getFillRatio: () => (state === 'win' ? 1 : fillRatio()),
  getFill: () => Math.round((state === 'win' ? 1 : fillRatio()) * 100),
  getCenter: () => com(),
  pointInVase: (x, y) => x > V.x - V.hw && x < V.x + V.hw && y > V.t && y < V.b,
  debugPlaceCatInVase: placeCatInVase,
  debugLaunchTowardVase: launchTowardVase
};
window.__liquidCat = { getParticleCount: () => conf.length };

/* ---------------- Main loop ---------------- */
let last = 0, acc = 0;
function frame(ts) {
  const dt = Math.min((ts - last) / 1000 || 0.016, 0.033); last = ts; time += dt;
  acc += dt;
  while (acc >= H120) { step(H120); acc -= H120; }
  update(dt); draw();
  requestAnimationFrame(frame);
}

loadAssets().then(() => {
  resize();
  resetRound(true);
  requestAnimationFrame(frame);
});
})();
</script>
</body>
</html>
